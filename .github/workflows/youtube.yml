name: YouTube Automation System

on:
  workflow_dispatch:

jobs:
  youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Upload video to YouTube
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python <<'PY'
          import os
          import sys

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          client_id = os.environ["GOOGLE_CLIENT_ID"]
          client_secret = os.environ["GOOGLE_CLIENT_SECRET"]
          refresh_token = os.environ["YOUTUBE_REFRESH_TOKEN"]

          video_file = "video.mp4"

          if not os.path.exists(video_file):
              print("HATA: video.mp4 bulunamadı.")
              sys.exit(1)

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/youtube"],
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
          )

          body = {
              "snippet": {
                  "title": "Kayıp Hikâyeler",
                  "description": "Kayıp Hikâyeler YouTube otomasyon sistemi tarafından yüklenmiştir.",
                  "categoryId": "22",
              },
              "status": {
                  "privacyStatus": "private"
              }
          }

          media = MediaFileUpload(
              video_file,
              mimetype="video/mp4",
              resumable=True,
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media,
          )

          response = request.execute()

          print("VIDEO YÜKLENDİ")
          print("Video ID:", response["id"])
          print("Durum:", response["status"]["privacyStatus"])
          PY
