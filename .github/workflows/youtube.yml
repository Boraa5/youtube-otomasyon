name: YouTube Automation System

on:
  workflow_dispatch:

jobs:
  youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Google credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "GOOGLE_CLIENT_ID eksik!"
            exit 1
          fi

          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "GOOGLE_CLIENT_SECRET eksik!"
            exit 1
          fi

          if [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "YOUTUBE_REFRESH_TOKEN eksik!"
            exit 1
          fi

          echo "Google ve YouTube kimlik bilgileri hazır."

      - name: Check video file
        run: |
          if [ -f "video.mp4" ]; then
            echo "video.mp4 bulundu."
          else
            echo "video.mp4 bulunamadı."
            echo "Şimdilik bağlantı testi başarılı."
          fi

      - name: Automation test
        run: |
          echo "YouTube otomasyon sistemi çalışıyor."
          echo "Tüm kontroller tamamlandı."
