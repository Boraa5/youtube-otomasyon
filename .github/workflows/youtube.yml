name: YouTube AI Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install -U openai google-api-python-client google-auth requests "piper-tts==1.4.2"

      - name: Check secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY missing"; exit 1; }
          test -n "$GOOGLE_CLIENT_ID" || { echo "GOOGLE_CLIENT_ID missing"; exit 1; }
          test -n "$GOOGLE_CLIENT_SECRET" || { echo "GOOGLE_CLIENT_SECRET missing"; exit 1; }
          test -n "$YOUTUBE_REFRESH_TOKEN" || { echo "YOUTUBE_REFRESH_TOKEN missing"; exit 1; }
          test -n "$PEXELS_API_KEY" || { echo "PEXELS_API_KEY missing"; exit 1; }
          echo "Secrets OK"

      - name: Run YouTube automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_MODEL: gpt-5.1

        run: |
          cat > automation.py <<'PY'
          import os
          import json
          import re
          import time
          import subprocess
          from pathlib import Path

          import requests
          from openai import OpenAI
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # =========================================================
          # AYARLAR
          # =========================================================

          OUT = Path("work")
          OUT.mkdir(parents=True, exist_ok=True)

          MODEL = os.getenv(
              "OPENAI_MODEL",
              "gpt-5.1"
          )

          client = OpenAI(
              api_key=os.environ["OPENAI_API_KEY"]
          )

          PEXELS_KEY = os.environ[
              "PEXELS_API_KEY"
          ]

          MIN_WORDS = 1800
          MAX_WORDS = 2000

          MIN_LONG_SECONDS = 480
          MAX_LONG_SECONDS = 900

          MIN_SHORT_WORDS = 100
          MAX_SHORT_WORDS = 220

          PIPER_DIR = OUT / "piper"
          PIPER_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          PIPER_MODEL = (
              PIPER_DIR /
              "tr_TR-dfki-medium.onnx"
          )

          PIPER_CONFIG = (
              PIPER_DIR /
              "tr_TR-dfki-medium.onnx.json"
          )

          PIPER_BASE = (
              "https://huggingface.co/"
              "rhasspy/piper-voices/"
              "resolve/v1.0.0/"
              "tr/tr_TR/dfki/medium/"
          )


          # =========================================================
          # YARDIMCI
          # =========================================================

          def run_command(command):

              print(
                  "CMD:",
                  " ".join(
                      map(str, command)
                  )
              )

              subprocess.run(
                  command,
                  check=True
              )


          def word_count(text):

              return len(
                  re.findall(
                      r"\b[\wÇĞİÖŞÜçğıöşü'-]+\b",
                      str(text)
                  )
              )


          def get_duration(path):

              result = (
                  subprocess.check_output(
                      [
                          "ffprobe",
                          "-v",
                          "error",
                          "-show_entries",
                          "format=duration",
                          "-of",
                          "default="
                          "noprint_wrappers=1:"
                          "nokey=1",
                          str(path)
                      ],
                      text=True
                  )
              )

              return float(
                  result.strip()
              )


          def clean_json(text):

              text = str(text).strip()

              text = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              start = text.find("{")
              end = text.rfind("}")

              if (
                  start < 0
                  or end <= start
              ):
                  raise RuntimeError(
                      "Model geçerli JSON döndürmedi."
                  )

              return json.loads(
                  text[
                      start:end + 1
                  ]
              )


          # =========================================================
          # PLAN DOĞRULAMA
          # =========================================================

          def validate_plan(data):

              required = [
                  "title",
                  "description",
                  "tags",
                  "narration",
                  "short_title",
                  "short_narration",
                  "scene_queries",
                  "short_queries",
                  "thumbnail_query"
              ]

              for key in required:

                  if key not in data:

                      raise RuntimeError(
                          f"Plan alanı eksik: {key}"
                      )

              if (
                  not isinstance(
                      data["tags"],
                      list
                  )
                  or not data["tags"]
              ):

                  raise RuntimeError(
                      "tags boş veya liste değil."
                  )

              if (
                  not isinstance(
                      data["scene_queries"],
                      list
                  )
                  or len(
                      data["scene_queries"]
                  ) != 12
              ):

                  raise RuntimeError(
                      "scene_queries tam 12 adet olmalı."
                  )

              if (
                  not isinstance(
                      data["short_queries"],
                      list
                  )
                  or len(
                      data["short_queries"]
                  ) != 6
              ):

                  raise RuntimeError(
                      "short_queries tam 6 adet olmalı."
                  )

              if not str(
                  data["thumbnail_query"]
              ).strip():

                  raise RuntimeError(
                      "thumbnail_query boş."
                  )


          # =========================================================
          # PLAN OLUŞTURMA
          # =========================================================

          def ask_plan():

              prompt = r"""
          Türkçe YouTube belgesel kanalı "Kayıp Hikâyeler" için TEK bir bölüm hazırla.

          Konu gizem, bilim, tarih, arkeoloji, uzay veya şaşırtıcı ama doğrulanabilir gerçeklerden biri olsun.

          Evergreen konu seç.

          ÇOK ÖNEMLİ:

          - Uydurma bilgi üretme.
          - Uydurma tarih üretme.
          - Uydurma sayı üretme.
          - Uydurma isim üretme.
          - Uydurma alıntı üretme.
          - Tartışmalı iddiaları kesin gerçek gibi anlatma.
          - Özel kişiler hakkında suçlama yapma.
          - Tıbbi tavsiye verme.
          - Siyasi propaganda yapma.
          - Web araştırması yap.
          - Güvenilir üniversite, müze, devlet kurumu,
            bilimsel kurum, birincil kaynak ve güvenilir
            haber kaynaklarını tercih et.

          ANA SENARYO:

          1800-2000 Türkçe kelime.

          İlk 15 saniye güçlü merak kancası olsun.

          Yapı:

          1. Güçlü giriş
          2. Konunun arka planı
          3. Olayların kronolojisi
          4. Kanıtlar
          5. Alternatif açıklamalar
          6. En güçlü bulgular
          7. Dengeli sonuç
          8. Kısa kapanış

          Doğal konuşma dili kullan.

          Narration içinde başlık kullanma.

          Kaynak listesini narration içine koyma.

          SHORT:

          100-220 Türkçe kelime.

          35-75 saniyelik konuşmaya uygun.

          Bağımsız anlaşılmalı.

          Güçlü giriş ve güçlü kapanış olmalı.

          Ana videodan basit bir kesit gibi yazma.

          GÖRSELLER:

          Ana video için tam 12 İngilizce Pexels arama sorgusu.

          Her sorgu 2-6 kelime olsun.

          Short için tam 6 İngilizce Pexels arama sorgusu.

          Thumbnail için 1 İngilizce Pexels arama sorgusu.

          Pexels'te bulunabilecek gerçek:
          yer, nesne, insan, bina, doğa, arkeolojik alan
          veya bilimsel ekipmanı tarif et.

          SADECE şu JSON yapısını döndür:

          {
            "title": "...",
            "description": "...",
            "tags": [
              "..."
            ],
            "narration": "...",
            "short_title": "...",
            "short_narration": "...",
            "scene_queries": [
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "short_queries": [
              "...",
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "thumbnail_query": "..."
          }
          """

              response = client.responses.create(
                  model=MODEL,
                  tools=[
                      {
                          "type": "web_search"
                      }
                  ],
                  input=prompt,
                  reasoning={
                      "effort": "low"
                  },
                  max_output_tokens=16000
              )

              return clean_json(
                  response.output_text
              )


          # =========================================================
          # SENARYO DÜZELTME
          # =========================================================

          def repair_narration(
              narration,
              current_words
          ):

              if current_words < MIN_WORDS:

                  instruction = (
                      f"Yaklaşık "
                      f"{MIN_WORDS - current_words} "
                      f"yeni kelime ekle; "
                      f"hedef {MIN_WORDS}-"
                      f"{MAX_WORDS} kelime."
                  )

              else:

                  instruction = (
                      f"Gereksiz tekrarları çıkar; "
                      f"hedef {MIN_WORDS}-"
                      f"{MAX_WORDS} kelime."
                  )

              prompt = f"""
          Aşağıdaki Türkçe belgesel narration metnini
          gerçek bilgileri değiştirmeden düzenle.

          {instruction}

          Kurallar:

          - Yeni bilgi uydurma.
          - Tarih uydurma.
          - Sayı uydurma.
          - İsim uydurma.
          - Alıntı uydurma.
          - Mevcut önemli kanıtları koru.
          - Gerçek bilgileri değiştirme.
          - Tekrarları azalt.
          - Doğal Türkçe kullan.
          - Başlık yazma.
          - Kaynak listesi yazma.
          - Sadece düzeltilmiş narration döndür.

          METİN:

          {narration}
          """

              response = client.responses.create(
                  model=MODEL,
                  input=prompt,
                  reasoning={
                      "effort": "low"
                  },
                  max_output_tokens=16000
              )

              return (
                  response
                  .output_text
                  .strip()
              )


          # =========================================================
          # PLAN ÜRET
          # =========================================================

          def generate_plan():

              last_error = ""

              for attempt in range(
                  1,
                  7
              ):

                  print(
                      "=" * 60
                  )

                  print(
                      f"PLAN DENEMESİ "
                      f"{attempt}/6"
                  )

                  print(
                      "=" * 60
                  )

                  try:

                      data = ask_plan()

                      validate_plan(
                          data
                      )

                      narration = str(
                          data["narration"]
                      ).strip()

                      short_narration = str(
                          data["short_narration"]
                      ).strip()

                      if not narration:

                          raise RuntimeError(
                              "Ana narration boş."
                          )

                      if not short_narration:

                          raise RuntimeError(
                              "Short narration boş."
                          )

                      # -------------------------
                      # ANA SENARYO
                      # -------------------------

                      for repair in range(
                          1,
                          5
                      ):

                          wc = word_count(
                              narration
                          )

                          if (
                              MIN_WORDS
                              <= wc
                              <= MAX_WORDS
                          ):

                              break

                          print(
                              "Ana senaryo "
                              f"düzeltme {repair}/4:"
                              f" {wc} kelime"
                          )

                          narration = (
                              repair_narration(
                                  narration,
                                  wc
                              )
                          )

                      wc = word_count(
                          narration
                      )

                      if not (
                          MIN_WORDS
                          <= wc
                          <= MAX_WORDS
                      ):

                          raise RuntimeError(
                              f"Ana senaryo "
                              f"{wc} kelime; "
                              f"hedef "
                              f"{MIN_WORDS}-"
                              f"{MAX_WORDS}."
                          )

                      # -------------------------
                      # SHORT
                      # -------------------------

                      short_wc = word_count(
                          short_narration
                      )

                      if not (
                          MIN_SHORT_WORDS
                          <= short_wc
                          <= MAX_SHORT_WORDS
                      ):

                          raise RuntimeError(
                              f"Short "
                              f"{short_wc} kelime; "
                              f"hedef "
                              f"{MIN_SHORT_WORDS}-"
                              f"{MAX_SHORT_WORDS}."
                          )

                      data["narration"] = (
                          narration
                      )

                      data["short_narration"] = (
                          short_narration
                      )

                      print(
                          "=" * 60
                      )

                      print(
                          f"PLAN OK: "
                          f"ana={wc}"
                      )

                      print(
                          f"SHORT OK: "
                          f"{short_wc}"
                      )

                      print(
                          "=" * 60
                      )

                      return data

                  except Exception as exc:

                      last_error = str(
                          exc
                      )

                      print(
                          "Plan hatası:",
                          last_error
                      )

                      time.sleep(2)

              raise RuntimeError(
                  "6 denemede geçerli plan "
                  "üretilemedi: "
                  f"{last_error}"
              )


          # =========================================================
          # PIPER MODEL
          # =========================================================

          def download_file(
              url,
              output,
              min_size
          ):

              response = requests.get(
                  url,
                  stream=True,
                  timeout=180
              )

              response.raise_for_status()

              with output.open(
                  "wb"
              ) as f:

                  for chunk in response.iter_content(
                      1024 * 1024
                  ):

                      if chunk:

                          f.write(
                              chunk
                          )

              if (
                  not output.exists()
                  or output.stat().st_size
                  < min_size
              ):

                  raise RuntimeError(
                      f"Eksik dosya: "
                      f"{output}"
                  )


          def install_piper_voice():

              if (
                  PIPER_MODEL.exists()
                  and PIPER_CONFIG.exists()
                  and PIPER_MODEL.stat().st_size
                  > 50_000_000
              ):

                  print(
                      "Piper Türkçe DFKI "
                      "modeli hazır."
                  )

                  return

              print(
                  "Piper Türkçe DFKI "
                  "modeli indiriliyor..."
              )

              download_file(
                  PIPER_BASE
                  + "tr_TR-dfki-medium.onnx",
                  PIPER_MODEL,
                  50_000_000
              )

              download_file(
                  PIPER_BASE
                  + "tr_TR-dfki-medium.onnx.json",
                  PIPER_CONFIG,
                  500
              )

              print(
                  "Piper modeli hazır."
              )


          # =========================================================
          # PEXELS
          # =========================================================

          def pexels_search(
              query,
              orientation
          ):

              query = re.sub(
                  r"[^A-Za-z0-9À-ÿ\s-]",
                  " ",
                  str(query)
              )

              query = re.sub(
                  r"\s+",
                  " ",
                  query
              ).strip()

              query = query[:100]

              if not query:

                  query = "documentary"

              response = requests.get(
                  "https://api.pexels.com/v1/search",
                  headers={
                      "Authorization":
                          PEXELS_KEY
                  },
                  params={
                      "query": query,
                      "orientation": orientation,
                      "per_page": 20,
                      "page": 1
                  },
                  timeout=30
              )

              response.raise_for_status()

              photos = (
                  response
                  .json()
                  .get(
                      "photos",
                      []
                  )
              )

              if not photos:

                  raise RuntimeError(
                      "Pexels sonuç yok: "
                      f"{query}"
                  )

              return photos


          def download_pexels_image(
              query,
              output,
              orientation,
              used_ids
          ):

              photos = pexels_search(
                  query,
                  orientation
              )

              selected = next(
                  (
                      photo
                      for photo in photos
                      if photo["id"]
                      not in used_ids
                  ),
                  photos[0]
              )

              used_ids.add(
                  selected["id"]
              )

              src = selected.get(
                  "src",
                  {}
              )

              if orientation == "portrait":

                  image_url = (
                      src.get("portrait")
                      or src.get("large2x")
                      or src.get("original")
                  )

              else:

                  image_url = (
                      src.get("landscape")
                      or src.get("large2x")
                      or src.get("original")
                  )

              if not image_url:

                  raise RuntimeError(
                      "Pexels görsel URL'si yok."
                  )

              response = requests.get(
                  image_url,
                  timeout=60
              )

              response.raise_for_status()

              output.write_bytes(
                  response.content
              )

              if (
                  output.stat().st_size
                  < 5000
              ):

                  raise RuntimeError(
                      f"Görsel eksik: "
                      f"{output}"
                  )

              return {
                  "id": selected["id"],
                  "url": selected.get(
                      "url",
                      ""
                  ),
                  "photographer":
                      selected.get(
                          "photographer",
                          ""
                      ),
                  "photographer_url":
                      selected.get(
                          "photographer_url",
                          ""
                      ),
                  "query": query
              }


          def generate_pexels_images(
              queries,
              prefix,
              orientation
          ):

              images = []
              credits = []
              used_ids = set()

              for index, query in enumerate(
                  queries,
                  1
              ):

                  output = (
                      OUT /
                      f"{prefix}_{index:02d}.jpg"
                  )

                  for retry in range(
                      1,
                      4
                  ):

                      try:

                          credit = (
                              download_pexels_image(
                                  query,
                                  output,
                                  orientation,
                                  used_ids
                              )
                          )

                          break

                      except Exception as exc:

                          print(
                              f"Pexels deneme "
                              f"{retry}/3:",
                              exc
                          )

                          if retry == 3:
                              raise

                          time.sleep(2)

                  images.append(
                      output
                  )

                  credits.append(
                      credit
                  )

                  print(
                      f"Pexels görsel "
                      f"{index}/"
                      f"{len(queries)} hazır."
                  )

              return (
                  images,
                  credits
              )


          # =========================================================
          # PIPER TTS
          # =========================================================

          def piper_one_chunk(
              text,
              output
          ):

              command = [
                  "piper",
                  "--model",
                  str(PIPER_MODEL),
                  "--output_file",
                  str(output),
                  "--sentence_silence",
                  "0.18",
                  "--length_scale",
                  "0.88",
                  "--noise_scale",
                  "0.667",
                  "--noise_w",
                  "0.8"
              ]

              process = subprocess.Popen(
                  command,
                  stdin=subprocess.PIPE,
                  text=True
              )

              process.communicate(
                  text
              )

              if process.returncode != 0:

                  raise RuntimeError(
                      "Piper TTS başarısız."
                  )

              if (
                  not output.exists()
                  or output.stat().st_size
                  < 1000
              ):

                  raise RuntimeError(
                      "Piper WAV oluşturamadı."
                  )


          def piper_tts(
              text,
              output
          ):

              text = str(text).strip()

              if not text:

                  raise RuntimeError(
                      "TTS metni boş."
                  )

              chunks = []
              current = ""

              paragraphs = [
                  x.strip()
                  for x in re.split(
                      r"\n+",
                      text
                  )
                  if x.strip()
              ]

              for paragraph in paragraphs:

                  while len(
                      paragraph
                  ) > 2200:

                      cut = paragraph.rfind(
                          " ",
                          0,
                          2200
                      )

                      if cut < 500:

                          cut = 2200

                      chunks.append(
                          paragraph[
                              :cut
                          ].strip()
                      )

                      paragraph = (
                          paragraph[
                              cut:
                          ].strip()
                      )

                  if not paragraph:
                      continue

                  if (
                      current
                      and len(current)
                      + len(paragraph)
                      + 1
                      > 2500
                  ):

                      chunks.append(
                          current
                      )

                      current = paragraph

                  else:

                      current = (
                          current
                          + " "
                          + paragraph
                      ).strip()

              if current:

                  chunks.append(
                      current
                  )

              if not chunks:

                  raise RuntimeError(
                      "TTS chunk oluşmadı."
                  )

              parts = []

              for index, chunk in enumerate(
                  chunks
              ):

                  part = (
                      OUT /
                      f"{output.stem}_"
                      f"{index:03d}.wav"
                  )

                  piper_one_chunk(
                      chunk,
                      part
                  )

                  parts.append(
                      part
                  )

              concat = (
                  OUT /
                  f"{output.stem}_concat.txt"
              )

              with concat.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for part in parts:

                      f.write(
                          f"file '{part.resolve()}'\n"
                      )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(concat),
                      "-vn",
                      "-c:a",
                      "libmp3lame",
                      "-b:a",
                      "160k",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size
                  < 1000
              ):

                  raise RuntimeError(
                      "MP3 oluşturulamadı."
                  )


          # =========================================================
          # VIDEO
          # =========================================================

          def make_video(
              audio,
              images,
              output,
              vertical=False
          ):

              if not images:

                  raise RuntimeError(
                      "Video görselleri yok."
                  )

              total = get_duration(
                  audio
              )

              per_scene = (
                  total /
                  len(images)
              )

              if per_scene < 2:

                  raise RuntimeError(
                      "Görsel başına süre "
                      "2 saniyeden kısa."
                  )

              slides = (
                  OUT /
                  f"{output.stem}_slides.txt"
              )

              with slides.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for image in images:

                      f.write(
                          f"file '{image.resolve()}'\n"
                      )

                      f.write(
                          f"duration "
                          f"{per_scene:.3f}\n"
                      )

                  f.write(
                      f"file "
                      f"'{images[-1].resolve()}'\n"
                  )

              if vertical:

                  vf = (
                      "scale=1080:1920:"
                      "force_original_aspect_ratio="
                      "increase,"
                      "crop=1080:1920,"
                      "format=yuv420p"
                  )

              else:

                  vf = (
                      "scale=1280:720:"
                      "force_original_aspect_ratio="
                      "increase,"
                      "crop=1280:720,"
                      "format=yuv420p"
                  )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(slides),
                      "-i",
                      str(audio),
                      "-vf",
                      vf,
                      "-r",
                      "25",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "22",
                      "-c:a",
                      "aac",
                      "-b:a",
                      "160k",
                      "-shortest",
                      "-movflags",
                      "+faststart",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size
                  < 10000
              ):

                  raise RuntimeError(
                      f"Video oluşmadı: "
                      f"{output}"
                  )


          # =========================================================
          # THUMBNAIL
          # =========================================================

          def prepare_thumbnail(
              source,
              output
          ):

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(source),
                      "-vf",
                      (
                          "scale=1280:720:"
                          "force_original_aspect_ratio="
                          "increase,"
                          "crop=1280:720"
                      ),
                      "-q:v",
                      "3",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size
                  < 5000
              ):

                  raise RuntimeError(
                      "Thumbnail oluşturulamadı."
                  )


          # =========================================================
          # YOUTUBE
          # =========================================================

          def youtube():

              credentials = Credentials(
                  token=None,
                  refresh_token=os.environ[
                      "YOUTUBE_REFRESH_TOKEN"
                  ],
                  token_uri=(
                      "https://oauth2.googleapis.com/token"
                  ),
                  client_id=os.environ[
                      "GOOGLE_CLIENT_ID"
                  ],
                  client_secret=os.environ[
                      "GOOGLE_CLIENT_SECRET"
                  ],
                  scopes=[
                      "https://www.googleapis.com/"
                      "auth/youtube.upload"
                  ]
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=credentials,
                  cache_discovery=False
              )


          def upload_video(
              api,
              video_file,
              title,
              description,
              tags,
              thumbnail=None
          ):

              safe_tags = [
                  str(tag).strip()
                  for tag in tags
                  if str(tag).strip()
              ][:30]

              body = {
                  "snippet": {
                      "title": str(
                          title
                      )[:100],
                      "description": str(
                          description
                      )[:5000],
                      "tags": safe_tags,
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids":
                          False,
                      "containsSyntheticMedia":
                          True
                  }
              }

              media = MediaFileUpload(
                  str(video_file),
                  mimetype="video/mp4",
                  resumable=True,
                  chunksize=8 * 1024 * 1024
              )

              request = (
                  api
                  .videos()
                  .insert(
                      part="snippet,status",
                      body=body,
                      media_body=media
                  )
              )

              response = None
              retry = 0

              while response is None:

                  try:

                      status, response = (
                          request.next_chunk()
                      )

                      if status:

                          print(
                              "YouTube yükleme:",
                              int(
                                  status.progress()
                                  * 100
                              ),
                              "%"
                          )

                  except Exception as exc:

                      retry += 1

                      if retry > 5:
                          raise

                      wait = min(
                          2 ** retry,
                          30
                      )

                      print(
                          "YouTube bağlantı hatası:",
                          exc
                      )

                      print(
                          wait,
                          "saniye bekleniyor..."
                      )

                      time.sleep(
                          wait
                      )

              video_id = response[
                  "id"
              ]

              print(
                  "YouTube video ID:",
                  video_id
              )

              if (
                  thumbnail
                  and thumbnail.exists()
              ):

                  thumb_media = (
                      MediaFileUpload(
                          str(thumbnail),
                          mimetype="image/jpeg"
                      )
                  )

                  (
                      api
                      .thumbnails()
                      .set(
                          videoId=video_id,
                          media_body=thumb_media
                      )
                      .execute()
                  )

                  print(
                      "Thumbnail yüklendi."
                  )

              return video_id


          # =========================================================
          # AÇIKLAMA
          # =========================================================

          def build_description(
              base_description,
              credits
          ):

              lines = [
                  str(
                      base_description
                  ).strip(),
                  "",
                  "Bu video özgün senaryo, "
                  "yapay zekâ destekli seslendirme "
                  "ve Pexels görselleri kullanılarak "
                  "hazırlanmıştır.",
                  "",
                  "Pexels kaynakları:",
                  "Photos provided by Pexels"
              ]

              seen = set()

              for credit in credits:

                  photo_id = credit.get(
                      "id"
                  )

                  if photo_id in seen:
                      continue

                  seen.add(
                      photo_id
                  )

                  photographer = (
                      credit.get(
                          "photographer"
                      )
                      or
                      "Pexels photographer"
                  )

                  url = credit.get(
                      "url",
                      ""
                  )

                  if url:

                      lines.append(
                          f"Photo by "
                          f"{photographer} "
                          f"on Pexels: "
                          f"{url}"
                      )

              lines.extend(
                  [
                      "",
                      "#KayıpHikâyeler",
                      "#Gizem",
                      "#Belgesel"
                  ]
              )

              return "\n".join(
                  lines
              )[:5000]


