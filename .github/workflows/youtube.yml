name: YouTube AI Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          python -m pip install --upgrade pip

          pip install \
            "openai>=2.38,<3" \
            "google-api-python-client>=2.170,<3" \
            "google-auth>=2.35,<3" \
            "requests>=2.31,<3" \
            "piper-tts==1.4.2"

          python -m piper --help >/dev/null
          ffmpeg -version >/dev/null

          echo "Python:"
          python --version

          echo "Piper:"
          python -m piper --help | head -n 5

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

      - name: Check secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e

          test -n "$OPENAI_API_KEY" || {
            echo "OPENAI_API_KEY missing"
            exit 1
          }

          test -n "$GOOGLE_CLIENT_ID" || {
            echo "GOOGLE_CLIENT_ID missing"
            exit 1
          }

          test -n "$GOOGLE_CLIENT_SECRET" || {
            echo "GOOGLE_CLIENT_SECRET missing"
            exit 1
          }

          test -n "$YOUTUBE_REFRESH_TOKEN" || {
            echo "YOUTUBE_REFRESH_TOKEN missing"
            exit 1
          }

          test -n "$PEXELS_API_KEY" || {
            echo "PEXELS_API_KEY missing"
            exit 1
          }

          echo "Secrets OK"

      - name: Run YouTube automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra

        run: |
          set -e

          cat > automation.py <<'PY'

          import os
          import json
          import re
          import time
          import hashlib
          import subprocess
          from pathlib import Path

          import requests
          from openai import OpenAI
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError


          # =========================================================
          # AYARLAR
          # =========================================================

          OUT = Path("work")
          OUT.mkdir(parents=True, exist_ok=True)

          MODEL = os.getenv(
              "OPENAI_MODEL",
              "gpt-5.6-terra"
          )

          client = OpenAI(
              api_key=os.environ["OPENAI_API_KEY"]
          )

          PEXELS_KEY = os.environ[
              "PEXELS_API_KEY"
          ]

          MIN_WORDS = 1800
          MAX_WORDS = 2200

          MIN_SHORT_WORDS = 100
          MAX_SHORT_WORDS = 160

          MIN_LONG_SECONDS = 480
          MAX_LONG_SECONDS = 1200

          MIN_SHORT_SECONDS = 35
          MAX_SHORT_SECONDS = 75


          # =========================================================
          # PIPER
          # =========================================================

          PIPER_DIR = OUT / "piper"

          PIPER_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          PIPER_MODEL = (
              PIPER_DIR /
              "tr_TR-dfki-medium.onnx"
          )

          PIPER_CONFIG = (
              PIPER_DIR /
              "tr_TR-dfki-medium.onnx.json"
          )

          PIPER_BASE = (
              "https://huggingface.co/"
              "rhasspy/piper-voices/resolve/v1.0.0/"
              "tr/tr_TR/dfki/medium/"
          )

          PIPER_MODEL_MIN_SIZE = 50_000_000
          PIPER_CONFIG_MIN_SIZE = 500


          # =========================================================
          # YARDIMCI
          # =========================================================

          def run_command(command):
              print(
                  "CMD:",
                  " ".join(map(str, command))
              )

              subprocess.run(
                  command,
                  check=True
              )


          def word_count(text):
              return len(
                  re.findall(
                      r"\b[\wÇĞİÖŞÜçğıöşü'-]+\b",
                      str(text)
                  )
              )


          def get_duration(path):

              result = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  text=True
              )

              return float(result.strip())


          def clean_json(text):

              text = str(text).strip()

              text = re.sub(
                  r"^```json\s*",
                  "",
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r"^```\s*",
                  "",
                  text
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              start = text.find("{")
              end = text.rfind("}")

              if start < 0 or end <= start:
                  raise RuntimeError(
                      "Model geçerli JSON döndürmedi."
                  )

              try:
                  return json.loads(
                      text[start:end + 1]
                  )

              except json.JSONDecodeError as exc:
                  raise RuntimeError(
                      f"JSON parse hatası: {exc}"
                  ) from exc


          # =========================================================
          # SORGU KONTROL
          # =========================================================

          def validate_query(
              query,
              name
          ):

              query = str(query).strip()

              words = query.split()

              if not 2 <= len(words) <= 6:
                  raise RuntimeError(
                      f"{name} 2-6 kelime olmalı: "
                      f"{query!r}"
                  )

              if not re.fullmatch(
                  r"[A-Za-z0-9][A-Za-z0-9 ,.'&-]*",
                  query
              ):
                  raise RuntimeError(
                      f"{name} İngilizce sorgu "
                      f"formatında değil: {query!r}"
                  )


          def validate_queries(
              items,
              expected,
              name
          ):

              if (
                  not isinstance(items, list)
                  or len(items) != expected
              ):
                  raise RuntimeError(
                      f"{name} tam {expected} adet olmalı."
                  )

              for i, item in enumerate(items, 1):
                  validate_query(
                      item,
                      f"{name}[{i}]"
                  )


          # =========================================================
          # PLAN KONTROL
          # =========================================================

          def validate_plan(data):

              required = [
                  "title",
                  "description",
                  "tags",
                  "narration",
                  "short_title",
                  "short_narration",
                  "scene_queries",
                  "short_queries",
                  "thumbnail_query"
              ]

              for key in required:
                  if key not in data:
                      raise RuntimeError(
                          f"Plan alanı eksik: {key}"
                      )

              if not str(data["title"]).strip():
                  raise RuntimeError(
                      "title boş."
                  )

              if not str(data["short_title"]).strip():
                  raise RuntimeError(
                      "short_title boş."
                  )

              if (
                  not isinstance(data["tags"], list)
                  or not data["tags"]
              ):
                  raise RuntimeError(
                      "tags boş veya liste değil."
                  )

              validate_queries(
                  data["scene_queries"],
                  12,
                  "scene_queries"
              )

              validate_queries(
                  data["short_queries"],
                  6,
                  "short_queries"
              )

              validate_query(
                  data["thumbnail_query"],
                  "thumbnail_query"
              )


          # =========================================================
          # OPENAI
          # =========================================================

          def ask_plan():

              prompt = r"""
          Türkçe YouTube belgesel kanalı "Kayıp Hikâyeler" için TEK bir bölüm hazırla.

          Konu:
          gizem, bilim, tarih, arkeoloji, uzay veya şaşırtıcı
          ama doğrulanabilir gerçeklerden biri olsun.

          Evergreen konu seç.

          WEB ARAŞTIRMASI ZORUNLU.

          Güvenilir üniversite, müze, devlet kurumu,
          bilimsel kurum, birincil kaynak ve güvenilir
          haber kaynaklarını tercih et.

          Uydurma bilgi üretme.

          Uydurma tarih üretme.

          Uydurma sayı üretme.

          Uydurma isim üretme.

          Uydurma alıntı üretme.

          Tartışmalı iddiaları kesin gerçek gibi anlatma.

          Özel kişiler hakkında suçlama yapma.

          Tıbbi tavsiye verme.

          Siyasi propaganda yapma.

          Kaynaklardan emin olmadığın ayrıntıyı kullanma.

          ANA SENARYO:

          1800-2000 Türkçe kelime.

          İlk 15 saniye güçlü merak kancası olsun.

          Yapı:

          1. Güçlü giriş
          2. Arka plan
          3. Kronoloji
          4. Kanıtlar
          5. Alternatif açıklamalar
          6. En güçlü bulgular
          7. Dengeli sonuç
          8. Kısa kapanış

          Doğal konuşma dili kullan.

          Narration içinde başlık kullanma.

          Kaynak listesini narration içine koyma.

          SHORT:

          100-160 Türkçe kelime.

          35-75 saniyelik konuşmaya uygun.

          Bağımsız anlaşılmalı.

          Güçlü giriş ve kapanış olmalı.

          Ana videonun basit kopyası gibi yazma.

          GÖRSELLER:

          Ana video için tam 12 İngilizce Pexels
          fotoğraf arama sorgusu.

          Short için tam 6 İngilizce Pexels
          fotoğraf arama sorgusu.

          Thumbnail için 1 İngilizce Pexels
          fotoğraf arama sorgusu.

          Her sorgu 2-6 kelime olsun.

          Türkçe karakter kullanma.

          Pexels'te bulunabilecek gerçek yer,
          nesne, bina, insan, doğa, arkeolojik alan
          veya bilimsel ekipmanı tarif et.

          SADECE JSON DÖNDÜR:

          {
            "title": "...",
            "description": "...",
            "tags": ["...", "..."],
            "narration": "...",
            "short_title": "...",
            "short_narration": "...",
            "scene_queries": [
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "short_queries": [
              "...",
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "thumbnail_query": "..."
          }
          """

              response = client.responses.create(
                  model=MODEL,
                  tools=[
                      {
                          "type": "web_search"
                      }
                  ],
                  input=prompt,
                  reasoning={
                      "effort": "medium"
                  },
                  max_output_tokens=20000
              )

              return clean_json(
                  response.output_text
              )


          # =========================================================
          # SENARYO DÜZELT
          # =========================================================

          def repair_narration(
              narration,
              current_words
          ):

              if current_words < MIN_WORDS:

                  instruction = (
                      f"Metni genişlet. "
                      f"Sonuç {MIN_WORDS}-"
                      f"{MAX_WORDS} kelime olmalı."
                  )

              else:

                  instruction = (
                      f"Tekrarları azalt. "
                      f"Sonuç {MIN_WORDS}-"
                      f"{MAX_WORDS} kelime olmalı."
                  )

              prompt = f"""
          Aşağıdaki Türkçe belgesel metnini düzenle.

          {instruction}

          GERÇEK BİLGİLERİ DEĞİŞTİRME.

          Yeni tarih uydurma.
          Yeni sayı uydurma.
          Yeni isim uydurma.
          Yeni alıntı uydurma.

          Mevcut önemli kanıtları koru.

          Tarihleri değiştirme.
          Sayıları değiştirme.
          Özel isimleri değiştirme.

          Doğal Türkçe kullan.

          Başlık yazma.

          Kaynak listesi yazma.

          Sadece düzeltilmiş narration döndür.

          METİN:

          {narration}
          """

              response = client.responses.create(
                  model=MODEL,
                  input=prompt,
                  reasoning={
                      "effort": "medium"
                  },
                  max_output_tokens=20000
              )

              return response.output_text.strip()


          def generate_plan():

              last_error = ""

              for attempt in range(1, 7):

                  print(
                      f"PLAN DENEMESİ {attempt}/6"
                  )

                  try:

                      data = ask_plan()

                      validate_plan(data)

                      narration = str(
                          data["narration"]
                      ).strip()

                      short_narration = str(
                          data["short_narration"]
                      ).strip()

                      if not narration:
                          raise RuntimeError(
                              "Ana narration boş."
                          )

                      if not short_narration:
                          raise RuntimeError(
                              "Short narration boş."
                          )

                      for repair in range(1, 5):

                          wc = word_count(
                              narration
                          )

                          if (
                              MIN_WORDS
                              <= wc
                              <= MAX_WORDS
                          ):
                              break

                          print(
                              f"Senaryo düzeltme "
                              f"{repair}/4: {wc} kelime"
                          )

                          narration = (
                              repair_narration(
                                  narration,
                                  wc
                              )
                          )

                      wc = word_count(
                          narration
                      )

                      short_wc = word_count(
                          short_narration
                      )

                      if not (
                          MIN_WORDS
                          <= wc
                          <= MAX_WORDS
                      ):
                          raise RuntimeError(
                              f"Ana senaryo {wc} kelime."
                          )

                      if not (
                          MIN_SHORT_WORDS
                          <= short_wc
                          <= MAX_SHORT_WORDS
                      ):
                          raise RuntimeError(
                              f"Short {short_wc} kelime."
                          )

                      data["narration"] = narration
                      data["short_narration"] = (
                          short_narration
                      )

                      print(
                          f"PLAN OK: ana={wc}, "
                          f"short={short_wc}"
                      )

                      return data

                  except Exception as exc:

                      last_error = str(exc)

                      print(
                          "Plan hatası:",
                          last_error
                      )

                      time.sleep(3)

              raise RuntimeError(
                  "6 denemede geçerli plan üretilemedi: "
                  + last_error
              )


          # =========================================================
          # DOSYA
          # =========================================================

          def sha256_file(path):

              digest = hashlib.sha256()

              with path.open("rb") as f:

                  for chunk in iter(
                      lambda: f.read(1024 * 1024),
                      b""
                  ):
                      digest.update(chunk)

              return digest.hexdigest()


          def download_file(
              url,
              output,
              min_size
          ):

              temp = output.with_suffix(
                  output.suffix + ".part"
              )

              response = requests.get(
                  url,
                  headers={
                      "User-Agent":
                          "youtube-ai-studio/1.0"
                  },
                  stream=True,
                  timeout=(20, 180)
              )

              response.raise_for_status()

              with temp.open("wb") as f:

                  for chunk in response.iter_content(
                      chunk_size=1024 * 1024
                  ):

                      if chunk:
                          f.write(chunk)

              if (
                  not temp.exists()
                  or temp.stat().st_size < min_size
              ):

                  temp.unlink(
                      missing_ok=True
                  )

                  raise RuntimeError(
                      f"Eksik dosya: {output}"
                  )

              temp.replace(output)


          # =========================================================
          # PIPER MODEL
          # =========================================================

          def install_piper_voice():

              if (
                  PIPER_MODEL.exists()
                  and PIPER_CONFIG.exists()
                  and PIPER_MODEL.stat().st_size
                  >= PIPER_MODEL_MIN_SIZE
                  and PIPER_CONFIG.stat().st_size
                  >= PIPER_CONFIG_MIN_SIZE
              ):

                  print(
                      "Piper modeli hazır."
                  )

                  return

              print(
                  "Piper Türkçe modeli indiriliyor..."
              )

              download_file(
                  PIPER_BASE
                  + "tr_TR-dfki-medium.onnx",
                  PIPER_MODEL,
                  PIPER_MODEL_MIN_SIZE
              )

              download_file(
                  PIPER_BASE
                  + "tr_TR-dfki-medium.onnx.json",
                  PIPER_CONFIG,
                  PIPER_CONFIG_MIN_SIZE
              )

              print(
                  "Piper modeli hazır."
              )


          # =========================================================
          # PEXELS
          # =========================================================

          def pexels_search(
              query,
              orientation
          ):

              query = re.sub(
                  r"[^A-Za-z0-9\s.'&-]",
                  " ",
                  str(query)
              )

              query = re.sub(
                  r"\s+",
                  " ",
                  query
              ).strip()

              if not query:
                  query = "documentary"

              last_error = None

              for attempt in range(1, 5):

                  try:

                      response = requests.get(
                          "https://api.pexels.com/v1/search",
                          headers={
                              "Authorization":
                                  PEXELS_KEY
                          },
                          params={
                              "query": query[:100],
                              "orientation":
                                  orientation,
                              "per_page": 20,
                              "page": 1
                          },
                          timeout=(15, 60)
                      )

                      if response.status_code == 429:

                          wait = int(
                              response.headers.get(
                                  "Retry-After",
                                  "5"
                              )
                          )

                          time.sleep(
                              min(wait, 30)
                          )

                          continue

                      response.raise_for_status()

                      photos = (
                          response
                          .json()
                          .get("photos", [])
                      )

                      if not photos:
                          raise RuntimeError(
                              f"Pexels sonuç yok: {query}"
                          )

                      return photos

                  except Exception as exc:

                      last_error = exc

                      print(
                          f"Pexels arama "
                          f"{attempt}/4:",
                          exc
                      )

                      if attempt < 4:
                          time.sleep(
                              min(2 ** attempt, 10)
                          )

              raise RuntimeError(
                  f"Pexels başarısız: "
                  f"{query}: {last_error}"
              )


          def download_pexels_image(
              query,
              output,
              orientation,
              used_ids
          ):

              photos = pexels_search(
                  query,
                  orientation
              )

              selected = next(
                  (
                      photo
                      for photo in photos
                      if photo["id"] not in used_ids
                  ),
                  photos[0]
              )

              used_ids.add(
                  selected["id"]
              )

              src = selected.get(
                  "src",
                  {}
              )

              if orientation == "portrait":

                  image_url = (
                      src.get("portrait")
                      or src.get("large2x")
                      or src.get("original")
                  )

              else:

                  image_url = (
                      src.get("landscape")
                      or src.get("large2x")
                      or src.get("original")
                  )

              if not image_url:
                  raise RuntimeError(
                      "Pexels görsel URL'si yok."
                  )

              response = requests.get(
                  image_url,
                  headers={
                      "User-Agent":
                          "youtube-ai-studio/1.0"
                  },
                  timeout=(15, 60)
              )

              response.raise_for_status()

              temp = output.with_suffix(
                  output.suffix + ".part"
              )

              temp.write_bytes(
                  response.content
              )

              if temp.stat().st_size < 5000:

                  temp.unlink(
                      missing_ok=True
                  )

                  raise RuntimeError(
                      "Pexels görsel eksik."
                  )

              temp.replace(output)

              return {
                  "id": selected["id"],
                  "url": selected.get(
                      "url",
                      ""
                  ),
                  "photographer":
                      selected.get(
                          "photographer",
                          ""
                      ),
                  "photographer_url":
                      selected.get(
                          "photographer_url",
                          ""
                      ),
                  "query": query
              }


          def generate_pexels_images(
              queries,
              prefix,
              orientation
          ):

              images = []
              credits = []
              used_ids = set()

              for index, query in enumerate(
                  queries,
                  1
              ):

                  output = (
                      OUT /
                      f"{prefix}_{index:02d}.jpg"
                  )

                  credit = None

                  for retry in range(1, 4):

                      try:

                          credit = (
                              download_pexels_image(
                                  query,
                                  output,
                                  orientation,
                                  used_ids
                              )
                          )

                          break

                      except Exception as exc:

                          print(
                              f"Pexels görsel "
                              f"{retry}/3:",
                              exc
                          )

                          if retry == 3:
                              raise

                          time.sleep(2)

                  images.append(output)
                  credits.append(credit)

              return images, credits


          # =========================================================
          # PIPER TTS
          # =========================================================

          def piper_one_chunk(
              text,
              output
          ):

              command = [
                  "python",
                  "-m",
                  "piper",
                  "--model",
                  str(PIPER_MODEL),
                  "--output_file",
                  str(output),
                  "--sentence-silence",
                  "0.18",
                  "--length-scale",
                  "0.88",
                  "--noise-scale",
                  "0.667",
                  "--noise-w",
                  "0.8"
              ]

              process = subprocess.Popen(
                  command,
                  stdin=subprocess.PIPE,
                  text=True
              )

              process.communicate(text)

              if process.returncode != 0:
                  raise RuntimeError(
                      "Piper TTS başarısız."
                  )

              if (
                  not output.exists()
                  or output.stat().st_size < 1000
              ):
                  raise RuntimeError(
                      "Piper WAV oluşturamadı."
                  )


          def piper_tts(
              text,
              output
          ):

              text = str(text).strip()

              if not text:
                  raise RuntimeError(
                      "TTS metni boş."
                  )

              chunks = []
              current = ""

              paragraphs = [
                  x.strip()
                  for x in re.split(
                      r"\n+",
                      text
                  )
                  if x.strip()
              ]

              for paragraph in paragraphs:

                  while len(paragraph) > 2200:

                      cut = paragraph.rfind(
                          " ",
                          0,
                          2200
                      )

                      if cut < 500:
                          cut = 2200

                      chunks.append(
                          paragraph[:cut].strip()
                      )

                      paragraph = (
                          paragraph[cut:].strip()
                      )

                  if not paragraph:
                      continue

                  if (
                      current
                      and
                      len(current)
                      + len(paragraph)
                      + 1
                      > 2500
                  ):

                      chunks.append(current)
                      current = paragraph

                  else:

                      current = (
                          current
                          + " "
                          + paragraph
                      ).strip()

              if current:
                  chunks.append(current)

              if not chunks:
                  raise RuntimeError(
                      "TTS chunk oluşmadı."
                  )

              parts = []

              for index, chunk in enumerate(
                  chunks
              ):

                  part = (
                      OUT /
                      f"{output.stem}_{index:03d}.wav"
                  )

                  piper_one_chunk(
                      chunk,
                      part
                  )

                  parts.append(part)

              concat = (
                  OUT /
                  f"{output.stem}_concat.txt"
              )

              with concat.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for part in parts:

                      path = str(
                          part.resolve()
                      ).replace(
                          "'",
                          "'\\''"
                      )

                      f.write(
                          f"file '{path}'\n"
                      )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(concat),
                      "-vn",
                      "-c:a",
                      "libmp3lame",
                      "-b:a",
                      "160k",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size < 1000
              ):
                  raise RuntimeError(
                      "MP3 oluşturulamadı."
                  )


          # =========================================================
          # VIDEO
          # =========================================================

          def make_video(
              audio,
              images,
              output,
              vertical=False
          ):

              if not images:
                  raise RuntimeError(
                      "Video görselleri yok."
                  )

              total = get_duration(audio)

              per_scene = (
                  total / len(images)
              )

              if per_scene < 2:
                  raise RuntimeError(
                      "Görsel başına süre 2 saniyeden kısa."
                  )

              slides = (
                  OUT /
                  f"{output.stem}_slides.txt"
              )

              with slides.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for image in images:

                      path = str(
                          image.resolve()
                      ).replace(
                          "'",
                          "'\\''"
                      )

                      f.write(
                          f"file '{path}'\n"
                      )

                      f.write(
                          f"duration {per_scene:.3f}\n"
                      )

                  last = str(
                      images[-1].resolve()
                  ).replace(
                      "'",
                      "'\\''"
                  )

                  f.write(
                      f"file '{last}'\n"
                  )

              if vertical:

                  vf = (
                      "scale=1080:1920:"
                      "force_original_aspect_ratio=increase,"
                      "crop=1080:1920,"
                      "format=yuv420p"
                  )

              else:

                  vf = (
                      "scale=1280:720:"
                      "force_original_aspect_ratio=increase,"
                      "crop=1280:720,"
                      "format=yuv420p"
                  )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(slides),
                      "-i",
                      str(audio),
                      "-vf",
                      vf,
                      "-r",
                      "25",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "22",
                      "-c:a",
                      "aac",
                      "-b:a",
                      "160k",
                      "-shortest",
                      "-movflags",
                      "+faststart",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size < 10000
              ):
                  raise RuntimeError(
                      f"Video oluşmadı: {output}"
                  )


          # =========================================================
          # THUMBNAIL
          # =========================================================

          def prepare_thumbnail(
              source,
              output
          ):

              for quality in range(4, 11):

                  run_command(
                      [
                          "ffmpeg",
                          "-y",
                          "-i",
                          str(source),
                          "-vf",
                          (
                              "scale=1280:720:"
                              "force_original_aspect_ratio=increase,"
                              "crop=1280:720"
                          ),
                          "-q:v",
                          str(quality),
                          str(output)
                      ]
                  )

                  if (
                      output.exists()
                      and output.stat().st_size
                      <= 1_900_000
                  ):

                      print(
                          "Thumbnail:",
                          output.stat().st_size,
                          "bytes"
                      )

                      return

              raise RuntimeError(
                  "Thumbnail 2 MB altına indirilemedi."
              )


          # =========================================================
          # GOOGLE / YOUTUBE
          # =========================================================

          def validate_google_oauth():

              response = requests.post(
                  "https://oauth2.googleapis.com/token",
                  data={
                      "client_id":
                          os.environ[
                              "GOOGLE_CLIENT_ID"
                          ],
                      "client_secret":
                          os.environ[
                              "GOOGLE_CLIENT_SECRET"
                          ],
                      "refresh_token":
                          os.environ[
                              "YOUTUBE_REFRESH_TOKEN"
                          ],
                      "grant_type":
                          "refresh_token"
                  },
                  timeout=30
              )

              if response.status_code != 200:

                  try:
                      detail = response.json()
                  except Exception:
                      detail = response.text[:500]

                  raise RuntimeError(
                      "Google OAuth başarısız: "
                      f"{detail}"
                  )

              if not response.json().get(
                  "access_token"
              ):
                  raise RuntimeError(
                      "Google access token alınamadı."
                  )

              print(
                  "Google OAuth OK."
              )


          def youtube():

              credentials = Credentials(
                  token=None,
                  refresh_token=os.environ[
                      "YOUTUBE_REFRESH_TOKEN"
                  ],
                  token_uri=
                      "https://oauth2.googleapis.com/token",
                  client_id=os.environ[
                      "GOOGLE_CLIENT_ID"
                  ],
                  client_secret=os.environ[
                      "GOOGLE_CLIENT_SECRET"
                  ],
                  scopes=[
                      "https://www.googleapis.com/"
                      "auth/youtube.upload"
                  ]
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=credentials,
                  cache_discovery=False
              )


