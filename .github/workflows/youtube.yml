name: YouTube AI Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade \
            openai \
            google-api-python-client \
            google-auth \
            requests \
            piper-tts==1.4.2

      - name: Check required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e

          test -n "$OPENAI_API_KEY" || {
            echo "ERROR: OPENAI_API_KEY eksik"
            exit 1
          }

          test -n "$GOOGLE_CLIENT_ID" || {
            echo "ERROR: GOOGLE_CLIENT_ID eksik"
            exit 1
          }

          test -n "$GOOGLE_CLIENT_SECRET" || {
            echo "ERROR: GOOGLE_CLIENT_SECRET eksik"
            exit 1
          }

          test -n "$YOUTUBE_REFRESH_TOKEN" || {
            echo "ERROR: YOUTUBE_REFRESH_TOKEN eksik"
            exit 1
          }

          test -n "$PEXELS_API_KEY" || {
            echo "ERROR: PEXELS_API_KEY eksik"
            exit 1
          }

          echo "Secrets OK"

      - name: Create automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cat > automation.py <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          import requests
          from openai import OpenAI
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # =========================================================
          # AYARLAR
          # =========================================================

          OUT = Path("work")
          OUT.mkdir(parents=True, exist_ok=True)

          client = OpenAI(
              api_key=os.environ["OPENAI_API_KEY"]
          )

          PEXELS_KEY = os.environ["PEXELS_API_KEY"]

          MIN_LONG_SECONDS = 420
          MAX_LONG_SECONDS = 900

          MIN_WORDS = 1800
          MAX_WORDS = 2000

          MIN_SHORT_WORDS = 100
          MAX_SHORT_WORDS = 220

          PIPER_DIR = OUT / "piper"
          PIPER_DIR.mkdir(parents=True, exist_ok=True)

          PIPER_MODEL = (
              PIPER_DIR /
              "tr_TR-fahrettin-medium.onnx"
          )

          PIPER_CONFIG = (
              PIPER_DIR /
              "tr_TR-fahrettin-medium.onnx.json"
          )

          PIPER_BASE = (
              "https://huggingface.co/"
              "rhasspy/piper-voices/"
              "resolve/"
              "de5443f334324e8e077d79b803b0fb08aff01f2b/"
              "tr/tr_TR/fahrettin/medium/"
          )


          # =========================================================
          # YARDIMCILAR
          # =========================================================

          def run_command(command, input_text=None):
              print("CMD:", " ".join(map(str, command)))

              result = subprocess.run(
                  command,
                  input=input_text,
                  text=True if input_text is not None else False,
                  capture_output=True
              )

              if result.stdout:
                  print(result.stdout)

              if result.stderr:
                  print(result.stderr)

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Komut başarısız oldu: "
                      f"{' '.join(map(str, command))}"
                  )

              return result


          def word_count(text):
              return len(
                  re.findall(
                      r"\b[\wÇĞİÖŞÜçğıöşü'-]+\b",
                      text or ""
                  )
              )


          def get_duration(path):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              return float(result.stdout.strip())


          # =========================================================
          # PIPER
          # =========================================================

          def install_piper_voice():

              if (
                  PIPER_MODEL.exists()
                  and PIPER_CONFIG.exists()
                  and PIPER_MODEL.stat().st_size > 10_000_000
                  and PIPER_CONFIG.stat().st_size > 500
              ):
                  print("Piper modeli hazır.")
                  return

              print("Piper Türkçe modeli indiriliyor...")

              model_url = (
                  PIPER_BASE
                  + "tr_TR-fahrettin-medium.onnx"
              )

              config_url = (
                  PIPER_BASE
                  + "tr_TR-fahrettin-medium.onnx.json"
              )

              with requests.get(
                  model_url,
                  stream=True,
                  timeout=180
              ) as response:

                  response.raise_for_status()

                  with PIPER_MODEL.open("wb") as file:

                      for chunk in response.iter_content(
                          chunk_size=1024 * 1024
                      ):
                          if chunk:
                              file.write(chunk)

              with requests.get(
                  config_url,
                  timeout=60
              ) as response:

                  response.raise_for_status()

                  PIPER_CONFIG.write_bytes(
                      response.content
                  )

              if PIPER_MODEL.stat().st_size < 10_000_000:
                  raise RuntimeError(
                      "Piper modeli eksik indirildi."
                  )

              if PIPER_CONFIG.stat().st_size < 500:
                  raise RuntimeError(
                      "Piper config eksik indirildi."
                  )

              print("Piper Türkçe modeli hazır.")


          def piper_tts(text, output):

              text = re.sub(
                  r"\s+",
                  " ",
                  text or ""
              ).strip()

              if not text:
                  raise RuntimeError(
                      "TTS metni boş."
                  )

              chunks = []

              while len(text) > 2800:

                  cut = text.rfind(
                      ". ",
                      0,
                      2800
                  )

                  if cut < 500:
                      cut = text.rfind(
                          " ",
                          0,
                          2800
                      )

                  if cut < 500:
                      cut = 2800

                  chunks.append(
                      text[:cut + 1].strip()
                  )

                  text = text[cut + 1:].strip()

              if text:
                  chunks.append(text)

              parts = []

              for index, chunk in enumerate(chunks):

                  part = (
                      OUT /
                      f"{output.stem}_{index:03d}.wav"
                  )

                  run_command(
                      [
                          "piper",
                          "--model",
                          str(PIPER_MODEL),
                          "--config",
                          str(PIPER_CONFIG),
                          "--output_file",
                          str(part),
                          "--sentence_silence",
                          "0.18",
                          "--length_scale",
                          "1.0",
                          "--noise_scale",
                          "0.667",
                          "--noise_w",
                          "0.8"
                      ],
                      input_text=chunk
                  )

                  if (
                      not part.exists()
                      or part.stat().st_size < 1000
                  ):
                      raise RuntimeError(
                          f"Piper ses oluşturamadı: {part}"
                      )

                  parts.append(part)

              concat = OUT / (
                  f"{output.stem}_concat.txt"
              )

              with concat.open(
                  "w",
                  encoding="utf-8"
              ) as file:

                  for part in parts:

                      safe_path = (
                          str(part.resolve())
                          .replace("'", "'\\''")
                      )

                      file.write(
                          f"file '{safe_path}'\n"
                      )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(concat),
                      "-vn",
                      "-c:a",
                      "libmp3lame",
                      "-b:a",
                      "160k",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size < 1000
              ):
                  raise RuntimeError(
                      "TTS MP3 oluşmadı."
                  )


          # =========================================================
          # OPENAI PLAN
          # =========================================================

          PLAN_SCHEMA = {
              "type": "object",
              "additionalProperties": False,
              "properties": {
                  "title": {"type": "string"},
                  "description": {"type": "string"},
                  "tags": {
                      "type": "array",
                      "items": {"type": "string"}
                  },
                  "narration": {"type": "string"},
                  "short_title": {"type": "string"},
                  "short_narration": {"type": "string"},
                  "scene_queries": {
                      "type": "array",
                      "items": {"type": "string"}
                  },
                  "short_queries": {
                      "type": "array",
                      "items": {"type": "string"}
                  },
                  "thumbnail_query": {"type": "string"}
              },
              "required": [
                  "title",
                  "description",
                  "tags",
                  "narration",
                  "short_title",
                  "short_narration",
                  "scene_queries",
                  "short_queries",
                  "thumbnail_query"
              ]
          }


          def ask_plan():

              prompt = """
          Türkçe YouTube belgesel kanalı "Kayıp Hikâyeler" için tek bölüm hazırla.

          Konu:
          gizem, bilim, tarih, arkeoloji, uzay veya açıklanabilir şaşırtıcı
          gerçeklerden biri olsun.

          Evergreen konu seç.

          Önemli:
          - Uydurma bilgi verme.
          - Gerçek olmayan sayı, tarih veya alıntı üretme.
          - Tartışmalı iddiaları kesin gerçek gibi sunma.
          - Siyasi propaganda yapma.
          - Özel kişiler hakkında suçlama yapma.
          - Tıbbi tavsiye verme.
          - Güvenilir kaynakları araştır.
          - Öncelikle üniversite, müze, devlet kurumu, bilim kurumu,
            birincil kaynak ve güvenilir haber kaynaklarını kullan.

          ANA SENARYO:
          - Türkçe.
          - 1800-2000 kelime.
          - 8-15 dakika civarında konuşma hedefle.
          - İlk 15 saniye güçlü merak kancası.
          - Doğal konuşma dili.
          - Başlıkları narration içine koyma.
          - Kaynak listesini narration içine koyma.
          - Giriş.
          - Arka plan.
          - Kronoloji.
          - Kanıtlar.
          - Alternatif açıklamalar.
          - En güçlü bulgular.
          - Dengeli sonuç.
          - Kısa kapanış.

          SHORT:
          - 100-220 Türkçe kelime.
          - Bağımsız anlaşılmalı.
          - Güçlü açılış.
          - Kendi kapanışı.
          - Ana videodan basit kopya olmasın.

          GÖRSELLER:
          Ana video için tam 12 İngilizce Pexels sorgusu.
          Short için tam 6 İngilizce Pexels sorgusu.
          Thumbnail için 1 İngilizce Pexels sorgusu.

          Sorgular 2-6 kelime olsun.
          Gerçek nesne, yer, olay veya ortam tarif et.
          "cinematic masterpiece" gibi soyut sorgular kullanma.

          SADECE JSON üret.
          """

              response = client.responses.create(
                  model="gpt-5.4-mini",
                  tools=[
                      {"type": "web_search"}
                  ],
                  input=prompt,
                  reasoning={
                      "effort": "low"
                  },
                  text={
                      "format": {
                          "type": "json_schema",
                          "name": "youtube_plan",
                          "strict": True,
                          "schema": PLAN_SCHEMA
                      }
                  },
                  max_output_tokens=12000
              )

              return json.loads(
                  response.output_text
              )


          def generate_plan():

              last_error = None

              for attempt in range(1, 6):

                  print(
                      f"Senaryo denemesi "
                      f"{attempt}/5"
                  )

                  try:

                      data = ask_plan()

                      wc = word_count(
                          data["narration"]
                      )

                      short_wc = word_count(
                          data["short_narration"]
                      )

                      print(
                          f"Ana: {wc} kelime"
                      )

                      print(
                          f"Short: {short_wc} kelime"
                      )

                      if not (
                          MIN_WORDS
                          <= wc
                          <= MAX_WORDS
                      ):
                          last_error = (
                              f"Ana senaryo "
                              f"{wc} kelime"
                          )
                          continue

                      if not (
                          MIN_SHORT_WORDS
                          <= short_wc
                          <= MAX_SHORT_WORDS
                      ):
                          last_error = (
                              f"Short senaryo "
                              f"{short_wc} kelime"
                          )
                          continue

                      if len(
                          data["scene_queries"]
                      ) != 12:
                          last_error = (
                              "Ana görsel sorguları 12 değil."
                          )
                          continue

                      if len(
                          data["short_queries"]
                      ) != 6:
                          last_error = (
                              "Short görsel sorguları 6 değil."
                          )
                          continue

                      if not data[
                          "thumbnail_query"
                      ].strip():
                          last_error = (
                              "Thumbnail sorgusu boş."
                          )
                          continue

                      print("PLAN OK")
                      return data

                  except Exception as error:

                      last_error = str(error)

                      print(
                          "Plan hatası:",
                          error
                      )

              raise RuntimeError(
                  "5 denemede geçerli plan üretilemedi. "
                  f"Son hata: {last_error}"
              )


          # =========================================================
          # PEXELS
          # =========================================================

          def pexels_search(
              query,
              orientation
          ):

              query = re.sub(
                  r"[^A-Za-z0-9À-ÿ\s-]",
                  " ",
                  str(query)
              )

              query = re.sub(
                  r"\s+",
                  " ",
                  query
              ).strip()

              if not query:
                  query = "documentary"

              response = requests.get(
                  "https://api.pexels.com/v1/search",
                  headers={
                      "Authorization": PEXELS_KEY
                  },
                  params={
                      "query": query[:100],
                      "orientation": orientation,
                      "per_page": 20,
                      "page": 1
                  },
                  timeout=30
              )

              response.raise_for_status()

              photos = response.json().get(
                  "photos",
                  []
              )

              if not photos:
                  raise RuntimeError(
                      f"Pexels sonuç bulamadı: {query}"
                  )

              return photos


          def download_pexels_image(
              query,
              output,
              orientation,
              used_ids
          ):

              photos = pexels_search(
                  query,
                  orientation
              )

              selected = None

              for photo in photos:

                  if photo["id"] not in used_ids:
                      selected = photo
                      break

              if selected is None:
                  selected = photos[0]

              used_ids.add(
                  selected["id"]
              )

              src = selected["src"]

              image_url = (
                  src.get("large2x")
                  or src.get("large")
                  or src.get("original")
              )

              if orientation == "portrait":
                  image_url = (
                      src.get("portrait")
                      or image_url
                  )

              if not image_url:
                  raise RuntimeError(
                      "Pexels görsel URL'si bulunamadı."
                  )

              response = requests.get(
                  image_url,
                  timeout=60
              )

              response.raise_for_status()

              output.write_bytes(
                  response.content
              )

              if output.stat().st_size < 5000:
                  raise RuntimeError(
                      f"Görsel düzgün indirilemedi: {output}"
                  )

              return {
                  "id": selected["id"],
                  "url": selected["url"],
                  "photographer": selected.get(
                      "photographer",
                      ""
                  ),
                  "photographer_url": selected.get(
                      "photographer_url",
                      ""
                  ),
                  "query": query
              }


          def generate_images(
              queries,
              prefix,
              orientation
          ):

              images = []
              credits = []
              used_ids = set()

              for index, query in enumerate(
                  queries,
                  start=1
              ):

                  output = OUT / (
                      f"{prefix}_{index:02d}.jpg"
                  )

                  credit = download_pexels_image(
                      query,
                      output,
                      orientation,
                      used_ids
                  )

                  images.append(output)
                  credits.append(credit)

                  print(
                      f"Görsel "
                      f"{index}/{len(queries)} hazır."
                  )

              return images, credits


          # =========================================================
          # VIDEO
          # =========================================================

          def make_video(
              audio,
              images,
              output,
              vertical=False
          ):

              if not images:
                  raise RuntimeError(
                      "Video görseli yok."
                  )

              duration = get_duration(
                  audio
              )

              per_scene = (
                  duration / len(images)
              )

              slides = OUT / (
                  f"{output.stem}_slides.txt"
              )

              with slides.open(
                  "w",
                  encoding="utf-8"
              ) as file:

                  for image in images:

                      safe_path = (
                          str(image.resolve())
                          .replace("'", "'\\''")
                      )

                      file.write(
                          f"file '{safe_path}'\n"
                      )

                      file.write(
                          f"duration {per_scene:.3f}\n"
                      )

                  last = (
                      str(images[-1].resolve())
                      .replace("'", "'\\''")
                  )

                  file.write(
                      f"file '{last}'\n"
                  )

              if vertical:

                  vf = (
                      "scale=1080:1920:"
                      "force_original_aspect_ratio="
                      "increase,"
                      "crop=1080:1920,"
                      "format=yuv420p"
                  )

              else:

                  vf = (
                      "scale=1280:720:"
                      "force_original_aspect_ratio="
                      "increase,"
                      "crop=1280:720,"
                      "format=yuv420p"
                  )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(slides),
                      "-i",
                      str(audio),
                      "-vf",
                      vf,
                      "-r",
                      "25",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "medium",
                      "-crf",
                      "22",
                      "-c:a",
                      "aac",
                      "-b:a",
                      "160k",
                      "-shortest",
                      "-movflags",
                      "+faststart",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size < 10000
              ):
                  raise RuntimeError(
                      f"Video oluşmadı: {output}"
                  )


          # =========================================================
          # YOUTUBE
          # =========================================================

          def youtube_api():

              credentials = Credentials(
                  token=None,
                  refresh_token=os.environ[
                      "YOUTUBE_REFRESH_TOKEN"
                  ],
                  token_uri=(
                      "https://oauth2.googleapis.com/token"
                  ),
                  client_id=os.environ[
                      "GOOGLE_CLIENT_ID"
                  ],
                  client_secret=os.environ[
                      "GOOGLE_CLIENT_SECRET"
                  ],
                  scopes=[
                      "https://www.googleapis.com/"
                      "auth/youtube.upload"
                  ]
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=credentials
              )


          def upload_video(
              api,
              video_file,
              title,
              description,
              tags,
              thumbnail=None
          ):

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": description[:5000],
                      "tags": tags[:30],
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  str(video_file),
                  mimetype="video/mp4",
                  resumable=True,
                  chunksize=8 * 1024 * 1024
              )

              request = api.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = request.execute()

              video_id = response["id"]

              print(
                  "YouTube video ID:",
                  video_id
              )

              if (
                  thumbnail is not None
                  and thumbnail.exists()
              ):

                  thumb_media = MediaFileUpload(
                      str(thumbnail),
                      mimetype="image/jpeg"
                  )

                  api.thumbnails().set(
                      videoId=video_id,
                      media_body=thumb_media
                  ).execute()

                  print(
                      "Thumbnail yüklendi."
                  )

              return video_id


          # =========================================================
          # DESCRIPTION
          # =========================================================

          def build_description(
              base_description,
              credits
          ):

              lines = [
                  base_description.strip(),
                  "",
                  "Bu video özgün senaryo, "
                  "yerel yapay zekâ destekli "
                  "seslendirme ve Pexels görselleri "
                  "kullanılarak hazırlanmıştır.",
                  "",
                  "Pexels kaynakları:"
              ]

              seen = set()

              for credit in credits:

                  if credit["id"] in seen:
                      continue

                  seen.add(
                      credit["id"]
                  )

                  photographer = (
                      credit["photographer"]
                      or "Pexels"
                  )

                  lines.append(
                      f"Photo by {photographer} "
                      f"on Pexels: "
                      f"{credit['url']}"
                  )

              lines.extend(
                  [
                      "",
                      "#KayıpHikâyeler "
                      "#Gizem "
                      "#Belgesel"
                  ]
              )

              return "\n".join(lines)


          # =========================================================
          # ANA PROGRAM
          # =========================================================

          def main():

              print("=" * 60)
              print("YOUTUBE AI STUDIO BAŞLIYOR")
              print("=" * 60)

              install_piper_voice()

              print("")
              print("1/8 PLAN OLUŞTURULUYOR")
              data = generate_plan()

              print("")
              print("2/8 ANA SES OLUŞTURULUYOR")

              long_audio = OUT / "long_audio.mp3"

              piper_tts(
                  data["narration"],
                  long_audio
              )

              long_seconds = get_duration(
                  long_audio
              )

              print(
                  f"Ana ses: "
                  f"{long_seconds:.1f} saniye"
              )

              if not (
                  MIN_LONG_SECONDS
                  <= long_seconds
                  <= MAX_LONG_SECONDS
              ):
                  raise RuntimeError(
                      "Ana ses süresi beklenen aralıkta değil: "
                      f"{long_seconds:.1f}"
                  )

              print("")
              print("3/8 ANA GÖRSELLER")

              long_images, long_credits = (
                  generate_images(
                      data["scene_queries"],
                      "long_scene",
                      "landscape"
                  )
              )

              print("")
              print("4/8 ANA VIDEO")

              long_video = OUT / "long_video.mp4"

              make_video(
                  long_audio,
                  long_images,
                  long_video,
                  vertical=False
              )

              print("")
              print("5/8 SHORT SES")

              short_audio = OUT / "short_audio.mp3"

              piper_tts(
                  data["short_narration"],
                  short_audio
              )

              short_seconds = get_duration(
                  short_audio
              )

              print(
                  f"Short ses: "
                  f"{short_seconds:.1f} saniye"
              )

              if not (
                  35
                  <= short_seconds
                  <= 75
              ):
                  raise RuntimeError(
                      "Short süresi beklenen aralıkta değil: "
                      f"{short_seconds:.1f}"
                  )

              print("")
              print("6/8 SHORT VIDEO")

              short_images, short_credits = (
                  generate_images(
                      data["short_queries"],
                      "short_scene",
                      "portrait"
                  )
              )

              short_video = OUT / "short_video.mp4"

              make_video(
                  short_audio,
                  short_images,
                  short_video,
                  vertical=True
              )

              print("")
              print("7/8 THUMBNAIL")

              thumbnail = OUT / "thumbnail.jpg"

              thumb_credit = (
                  download_pexels_image(
                      data["thumbnail_query"],
                      thumbnail,
                      "landscape",
                      set()
                  )
              )

              all_credits = (
                  long_credits
                  + short_credits
                  + [thumb_credit]
              )

              description = build_description(
                  data["description"],
                  all_credits
              )

              metadata = {
                  "title": data["title"],
                  "short_title": data["short_title"],
                  "long_seconds": long_seconds,
                  "short_seconds": short_seconds,
                  "scene_queries": data["scene_queries"],
                  "short_queries": data["short_queries"],
                  "thumbnail_query": data["thumbnail_query"],
                  "credits": all_credits
              }

              (OUT / "metadata.json").write_text(
                  json.dumps(
                      metadata,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("")
              print("8/8 YOUTUBE YÜKLEME")

              api = youtube_api()

              long_id = upload_video(
                  api,
                  long_video,
                  data["title"],
                  description,
                  data["tags"],
                  thumbnail
              )

              short_id = upload_video(
                  api,
                  short_video,
                  data["short_title"],
                  description,
                  data["tags"][:15],
                  None
              )

              print("")
              print("=" * 60)
              print("OTOMASYON BAŞARIYLA TAMAMLANDI")
              print("ANA VIDEO:", long_id)
              print("SHORT:", short_id)
              print("=" * 60)


          if __name__ == "__main__":
              main()
          PY

      - name: Validate Python
        run: |
          python -m py_compile automation.py
          echo "Python syntax OK"

      - name: Run YouTube automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python automation.py
