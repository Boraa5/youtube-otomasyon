name: YouTube AI Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install -U openai google-api-python-client google-auth requests "piper-tts==1.4.2"

      - name: Check secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY missing"; exit 1; }
          test -n "$GOOGLE_CLIENT_ID" || { echo "GOOGLE_CLIENT_ID missing"; exit 1; }
          test -n "$GOOGLE_CLIENT_SECRET" || { echo "GOOGLE_CLIENT_SECRET missing"; exit 1; }
          test -n "$YOUTUBE_REFRESH_TOKEN" || { echo "YOUTUBE_REFRESH_TOKEN missing"; exit 1; }
          test -n "$PEXELS_API_KEY" || { echo "PEXELS_API_KEY missing"; exit 1; }
          echo "Secrets OK"

      - name: Run YouTube automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cat > automation.py <<'PY'
          import os
          import json
          import re
          import time
          import subprocess
          from pathlib import Path

          import requests
          from openai import OpenAI
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # =========================================================
          # AYARLAR
          # =========================================================

          OUT = Path("work")
          OUT.mkdir(parents=True, exist_ok=True)

          client = OpenAI(
              api_key=os.environ["OPENAI_API_KEY"]
          )

          PEXELS_KEY = os.environ["PEXELS_API_KEY"]

          MIN_WORDS = 1800
          MAX_WORDS = 2000

          MIN_LONG_SECONDS = 480
          MAX_LONG_SECONDS = 900

          MIN_SHORT_WORDS = 100
          MAX_SHORT_WORDS = 220

          PIPER_DIR = OUT / "piper"
          PIPER_DIR.mkdir(parents=True, exist_ok=True)

          PIPER_MODEL = (
              PIPER_DIR /
              "tr_TR-fahrettin-medium.onnx"
          )

          PIPER_CONFIG = (
              PIPER_DIR /
              "tr_TR-fahrettin-medium.onnx.json"
          )

          PIPER_BASE = (
              "https://huggingface.co/"
              "rhasspy/piper-voices/"
              "resolve/"
              "de5443f334324e8e077d79b803b0fb08aff01f2b/"
              "tr/tr_TR/fahrettin/medium/"
          )


          # =========================================================
          # YARDIMCI
          # =========================================================

          def run_command(command):
              print(
                  "CMD:",
                  " ".join(str(x) for x in command)
              )

              subprocess.run(
                  command,
                  check=True
              )


          def word_count(text):
              return len(
                  re.findall(
                      r"\b[\wÇĞİÖŞÜçğıöşü'-]+\b",
                      str(text)
                  )
              )


          def get_duration(path):
              result = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(path)
                  ],
                  text=True
              )

              return float(result.strip())


          def clean_json(text):
              text = str(text).strip()

              text = re.sub(
                  r"^```json\s*",
                  "",
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r"^```\s*",
                  "",
                  text
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              start = text.find("{")
              end = text.rfind("}")

              if start == -1 or end == -1:
                  raise RuntimeError(
                      "Model geçerli JSON döndürmedi."
                  )

              return json.loads(
                  text[start:end + 1]
              )


          # =========================================================
          # PIPER MODEL
          # =========================================================

          def install_piper_voice():

              if (
                  PIPER_MODEL.exists()
                  and PIPER_CONFIG.exists()
                  and PIPER_MODEL.stat().st_size > 10_000_000
                  and PIPER_CONFIG.stat().st_size > 500
              ):
                  print(
                      "Piper Türkçe modeli hazır."
                  )
                  return

              print(
                  "Piper Türkçe modeli indiriliyor..."
              )

              model_url = (
                  PIPER_BASE
                  + "tr_TR-fahrettin-medium.onnx"
              )

              config_url = (
                  PIPER_BASE
                  + "tr_TR-fahrettin-medium.onnx.json"
              )

              response = requests.get(
                  model_url,
                  stream=True,
                  timeout=180
              )

              response.raise_for_status()

              with PIPER_MODEL.open("wb") as f:
                  for chunk in response.iter_content(
                      chunk_size=1024 * 1024
                  ):
                      if chunk:
                          f.write(chunk)

              response = requests.get(
                  config_url,
                  timeout=60
              )

              response.raise_for_status()

              PIPER_CONFIG.write_bytes(
                  response.content
              )

              if PIPER_MODEL.stat().st_size < 10_000_000:
                  raise RuntimeError(
                      "Piper modeli eksik indirildi."
                  )

              if PIPER_CONFIG.stat().st_size < 500:
                  raise RuntimeError(
                      "Piper config eksik indirildi."
                  )

              print(
                  "Piper Türkçe modeli hazır."
              )


          # =========================================================
          # PLAN OLUŞTURMA
          # =========================================================

          def ask_plan():

              prompt = r"""
          Türkçe YouTube belgesel kanalı "Kayıp Hikâyeler" için TEK bir bölüm hazırla.

          Konu:
          Gizem, bilim, tarih, arkeoloji, uzay veya şaşırtıcı ama
          doğrulanabilir gerçeklerden biri olsun.

          Evergreen konu seç.

          ÖNEMLİ:
          - Uydurma bilgi verme.
          - Gerçek olmayan sayı kullanma.
          - Gerçek olmayan tarih kullanma.
          - Gerçek olmayan alıntı kullanma.
          - Tartışmalı iddiaları kesin gerçek gibi anlatma.
          - Özel kişiler hakkında suçlama yapma.
          - Tıbbi tavsiye verme.
          - Siyasi propaganda yapma.
          - Güvenilir kaynakları tercih et.

          Web araştırması yap.
          Üniversite, müze, devlet kurumu, bilimsel kurum,
          birincil kaynak ve güvenilir haber kaynaklarını tercih et.

          ANA SENARYO:

          Tam 1800-2000 Türkçe kelime hedefle.

          İlk 15 saniye çok güçlü merak kancası olsun.

          Yapı:
          1. Güçlü giriş
          2. Konunun arka planı
          3. Olayların kronolojisi
          4. Kanıtlar
          5. Alternatif açıklamalar
          6. En güçlü bulgular
          7. Dengeli sonuç
          8. Kısa kapanış

          Doğal konuşma dili kullan.

          Narration içinde başlık kullanma.
          Kaynak listesini narration içine koyma.

          SHORT:

          100-220 Türkçe kelime.
          40-60 saniyelik konuşmaya uygun.
          Bağımsız anlaşılmalı.
          Güçlü giriş ve güçlü kapanış olmalı.
          Ana videodan basit bir kesit gibi yazma.

          GÖRSELLER:

          Ana video için tam 12 İngilizce Pexels arama sorgusu.

          Her sorgu 2-6 kelime olsun.

          Pexels'te bulunabilecek gerçek:
          yer, nesne, insan, bina, doğa, arkeolojik alan,
          bilimsel ekipman veya olayları tarif et.

          Short için tam 6 İngilizce Pexels sorgusu.

          Thumbnail için 1 İngilizce Pexels sorgusu.

          SADECE JSON DÖNDÜR:

          {
            "title": "...",
            "description": "...",
            "tags": [
              "..."
            ],
            "narration": "...",
            "short_title": "...",
            "short_narration": "...",
            "scene_queries": [
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "short_queries": [
              "...",
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "thumbnail_query": "..."
          }
          """

              response = client.responses.create(
                  model="gpt-5.4-mini",
                  tools=[
                      {
                          "type": "web_search"
                      }
                  ],
                  input=prompt,
                  reasoning={
                      "effort": "low"
                  },
                  max_output_tokens=12000
              )

              return clean_json(
                  response.output_text
              )


          # =========================================================
          # SENARYOYU DÜZELT / UZAT / KISALT
          # =========================================================

          def repair_narration(
              narration,
              current_words
          ):

              if current_words < MIN_WORDS:

                  needed = MIN_WORDS - current_words

                  prompt = f"""
          Aşağıdaki Türkçe belgesel narration metnini
          GERÇEK BİLGİLERİ BOZMADAN genişlet.

          Mevcut kelime sayısı yaklaşık:
          {current_words}

          En az:
          {MIN_WORDS}

          En fazla:
          {MAX_WORDS}

          Yaklaşık {needed} yeni kelime ekle.

          Kurallar:
          - Yeni bilgi uydurma.
          - Tarih uydurma.
          - Sayı uydurma.
          - İsim uydurma.
          - Aynı cümleleri tekrar etme.
          - Konunun arka planını açıklayabilirsin.
          - Kanıtları daha anlaşılır açıklayabilirsin.
          - Alternatif açıklamaları genişletebilirsin.
          - Sonucu daha iyi bağlayabilirsin.
          - Doğal Türkçe kullan.
          - Başlık yazma.
          - Kaynak listesi yazma.
          - Sadece narration döndür.

          METİN:

          {narration}
          """

              response = client.responses.create(
                  model="gpt-5.4-mini",
                  input=prompt,
                  reasoning={
                      "effort": "low"
                  },
                  max_output_tokens=12000
              )

              return response.output_text.strip()

          else:

              prompt = f"""
          Aşağıdaki Türkçe belgesel narration metnini
          gerçek bilgileri koruyarak kısalt.

          Hedef:
          {MIN_WORDS}-{MAX_WORDS} kelime.

          Kurallar:
          - Önemli kanıtları çıkarma.
          - Tarihleri değiştirme.
          - Sayıları değiştirme.
          - İsimleri değiştirme.
          - Bilgi uydurma.
          - Tekrarları kaldır.
          - Gereksiz cümleleri azalt.
          - Doğal Türkçe kullan.
          - Başlık yazma.
          - Kaynak listesi yazma.
          - Sadece narration döndür.

          METİN:

          {narration}
          """

              response = client.responses.create(
                  model="gpt-5.4-mini",
                  input=prompt,
                  reasoning={
                      "effort": "low"
                  },
                  max_output_tokens=12000
              )

              return response.output_text.strip()


          # =========================================================
          # PLAN DOĞRULAMA
          # =========================================================

          def generate_plan():

              last_error = ""

              for attempt in range(1, 7):

                  print(
                      "=" * 60
                  )

                  print(
                      f"PLAN DENEMESİ {attempt}/6"
                  )

                  print(
                      "=" * 60
                  )

                  try:

                      data = ask_plan()

                      narration = str(
                          data.get(
                              "narration",
                              ""
                          )
                      ).strip()

                      short_narration = str(
                          data.get(
                              "short_narration",
                              ""
                          )
                      ).strip()

                      if not narration:
                          raise RuntimeError(
                              "Ana narration boş."
                          )

                      if not short_narration:
                          raise RuntimeError(
                              "Short narration boş."
                          )

                      wc = word_count(
                          narration
                      )

                      short_wc = word_count(
                          short_narration
                      )

                      print(
                          f"Ana başlangıç: {wc} kelime"
                      )

                      print(
                          f"Short: {short_wc} kelime"
                      )

                      # -----------------------------------------
                      # ANA SENARYO OTOMATİK DÜZELTME
                      # -----------------------------------------

                      for repair in range(1, 5):

                          wc = word_count(
                              narration
                          )

                          if (
                              MIN_WORDS
                              <= wc
                              <= MAX_WORDS
                          ):
                              break

                          print(
                              f"Senaryo düzeltme "
                              f"{repair}/4"
                          )

                          narration = repair_narration(
                              narration,
                              wc
                          )

                          wc = word_count(
                              narration
                          )

                          print(
                              f"Yeni ana senaryo: "
                              f"{wc} kelime"
                          )

                      wc = word_count(
                          narration
                      )

                      if not (
                          MIN_WORDS
                          <= wc
                          <= MAX_WORDS
                      ):

                          last_error = (
                              f"Ana senaryo "
                              f"{wc} kelime."
                          )

                          print(
                              last_error
                          )

                          continue

                      # -----------------------------------------
                      # SHORT KONTROLÜ
                      # -----------------------------------------

                      short_wc = word_count(
                          short_narration
                      )

                      if not (
                          MIN_SHORT_WORDS
                          <= short_wc
                          <= MAX_SHORT_WORDS
                      ):

                          last_error = (
                              f"Short "
                              f"{short_wc} kelime."
                          )

                          print(
                              last_error
                          )

                          continue

                      # -----------------------------------------
                      # PEXELS KONTROLÜ
                      # -----------------------------------------

                      scene_queries = data.get(
                          "scene_queries",
                          []
                      )

                      short_queries = data.get(
                          "short_queries",
                          []
                      )

                      thumbnail_query = data.get(
                          "thumbnail_query",
                          ""
                      )

                      if len(scene_queries) != 12:

                          last_error = (
                              "Ana görsel sorguları "
                              "12 adet değil."
                          )

                          print(last_error)

                          continue

                      if len(short_queries) != 6:

                          last_error = (
                              "Short görsel sorguları "
                              "6 adet değil."
                          )

                          print(last_error)

                          continue

                      if not thumbnail_query:

                          last_error = (
                              "Thumbnail sorgusu boş."
                          )

                          print(last_error)

                          continue

                      # -----------------------------------------
                      # TEMİZ VERİYİ GERİ KOY
                      # -----------------------------------------

                      data["narration"] = narration
                      data["short_narration"] = short_narration

                      print(
                          "=" * 60
                      )

                      print(
                          f"PLAN OK: {wc} ana kelime"
                      )

                      print(
                          f"SHORT OK: {short_wc} kelime"
                      )

                      print(
                          "12 ana Pexels sorgusu OK"
                      )

                      print(
                          "6 Short Pexels sorgusu OK"
                      )

                      print(
                          "Thumbnail sorgusu OK"
                      )

                      print(
                          "=" * 60
                      )

                      return data

                  except Exception as exc:

                      last_error = str(exc)

                      print(
                          "Plan denemesinde hata:"
                      )

                      print(
                          last_error
                      )

                      time.sleep(2)

              raise RuntimeError(
                  "6 denemede geçerli plan "
                  "üretilemedi. "
                  f"Son hata: {last_error}"
              )


          # =========================================================
          # PEXELS ARAMA
          # =========================================================

          def pexels_search(
              query,
              orientation="landscape"
          ):

              query = re.sub(
                  r"[^A-Za-z0-9À-ÿ\s-]",
                  " ",
                  str(query)
              )

              query = re.sub(
                  r"\s+",
                  " ",
                  query
              ).strip()

              if not query:
                  query = "documentary"

              query = query[:100]

              response = requests.get(
                  "https://api.pexels.com/v1/search",
                  headers={
                      "Authorization": PEXELS_KEY
                  },
                  params={
                      "query": query,
                      "orientation": orientation,
                      "per_page": 20,
                      "page": 1
                  },
                  timeout=30
              )

              response.raise_for_status()

              photos = response.json().get(
                  "photos",
                  []
              )

              if not photos:
                  raise RuntimeError(
                      f"Pexels sonuç bulamadı: {query}"
                  )

              return photos


          def download_pexels_image(
              query,
              output,
              orientation,
              used_ids
          ):

              photos = pexels_search(
                  query,
                  orientation
              )

              selected = None

              for photo in photos:

                  if photo["id"] not in used_ids:
                      selected = photo
                      break

              if selected is None:
                  selected = photos[0]

              used_ids.add(
                  selected["id"]
              )

              src = selected.get(
                  "src",
                  {}
              )

              if orientation == "portrait":

                  image_url = (
                      src.get("portrait")
                      or src.get("large2x")
                      or src.get("original")
                  )

              else:

                  image_url = (
                      src.get("landscape")
                      or src.get("large2x")
                      or src.get("original")
                  )

              if not image_url:
                  raise RuntimeError(
                      "Pexels görsel URL'si bulunamadı."
                  )

              response = requests.get(
                  image_url,
                  timeout=60
              )

              response.raise_for_status()

              output.write_bytes(
                  response.content
              )

              if output.stat().st_size < 5000:
                  raise RuntimeError(
                      f"Görsel düzgün indirilemedi: "
                      f"{output}"
                  )

              return {
                  "id": selected["id"],
                  "url": selected.get(
                      "url",
                      ""
                  ),
                  "photographer": selected.get(
                      "photographer",
                      ""
                  ),
                  "photographer_url": selected.get(
                      "photographer_url",
                      ""
                  ),
                  "query": query
              }


          def generate_pexels_images(
              queries,
              prefix,
              orientation
          ):

              images = []
              credits = []
              used_ids = set()

              for index, query in enumerate(
                  queries
              ):

                  output = OUT / (
                      f"{prefix}_{index + 1:02d}.jpg"
                  )

                  for retry in range(1, 4):

                      try:

                          credit = (
                              download_pexels_image(
                                  query,
                                  output,
                                  orientation,
                                  used_ids
                              )
                          )

                          break

                      except Exception as exc:

                          print(
                              f"Pexels deneme "
                              f"{retry}/3: {exc}"
                          )

                          if retry == 3:
                              raise

                          time.sleep(2)

                  images.append(output)
                  credits.append(credit)

                  print(
                      f"Pexels görsel: "
                      f"{index + 1}/{len(queries)}"
                  )

              return images, credits


          # =========================================================
          # PIPER TTS
          # =========================================================

          def piper_one_chunk(
              text,
              output
          ):

              command = [
                  "piper",
                  "--model",
                  str(PIPER_MODEL),
                  "--output_file",
                  str(output),
                  "--sentence_silence",
                  "0.18",
                  "--length_scale",
                  "0.88",
                  "--noise_scale",
                  "0.667",
                  "--noise_w",
                  "0.8"
              ]

              print(
                  "Piper ses oluşturuyor..."
              )

              with subprocess.Popen(
                  command,
                  stdin=subprocess.PIPE,
                  text=True
              ) as process:

                  process.communicate(
                      text
                  )

                  if process.returncode != 0:
                      raise RuntimeError(
                          "Piper TTS başarısız."
                      )

              if (
                  not output.exists()
                  or output.stat().st_size < 1000
              ):
                  raise RuntimeError(
                      "Piper WAV oluşturamadı."
                  )


          def piper_tts(
              text,
              output
          ):

              text = str(text).strip()

              if not text:
                  raise RuntimeError(
                      "TTS metni boş."
                  )

              paragraphs = [
                  x.strip()
                  for x in re.split(
                      r"\n+",
                      text
                  )
                  if x.strip()
              ]

              chunks = []
              current = ""

              for paragraph in paragraphs:

                  while len(paragraph) > 2200:

                      cut = paragraph.rfind(
                          " ",
                          0,
                          2200
                      )

                      if cut < 500:
                          cut = 2200

                      piece = (
                          paragraph[:cut]
                          .strip()
                      )

                      chunks.append(piece)

                      paragraph = (
                          paragraph[cut:]
                          .strip()
                      )

                  if not paragraph:
                      continue

                  if (
                      current
                      and len(current)
                      + len(paragraph)
                      + 1 > 2500
                  ):

                      chunks.append(
                          current
                      )

                      current = paragraph

                  else:

                      current += (
                          " "
                          if current
                          else ""
                      ) + paragraph

              if current:
                  chunks.append(current)

              if not chunks:
                  raise RuntimeError(
                      "TTS chunk oluşmadı."
                  )

              parts = []

              for index, chunk in enumerate(
                  chunks
              ):

                  part = OUT / (
                      f"{output.stem}_"
                      f"{index:03d}.wav"
                  )

                  piper_one_chunk(
                      chunk,
                      part
                  )

                  parts.append(part)

              concat = OUT / (
                  f"{output.stem}_concat.txt"
              )

              with concat.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for part in parts:

                      safe_path = (
                          str(part.resolve())
                          .replace("'", "'\\''")
                      )

                      f.write(
                          f"file '{safe_path}'\n"
                      )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(concat),
                      "-vn",
                      "-c:a",
                      "libmp3lame",
                      "-b:a",
                      "160k",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size < 1000
              ):
                  raise RuntimeError(
                      "MP3 oluşturulamadı."
                  )


          # =========================================================
          # VİDEO OLUŞTUR
          # =========================================================

          def make_video(
              audio,
              images,
              output,
              vertical=False
          ):

              if not images:
                  raise RuntimeError(
                      "Video görselleri yok."
                  )

              total = get_duration(
                  audio
              )

              per_scene = (
                  total / len(images)
              )

              if per_scene < 2:
                  raise RuntimeError(
                      "Görsel başına süre çok kısa."
                  )

              slides = OUT / (
                  f"{output.stem}_slides.txt"
              )

              with slides.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for image in images:

                      safe_path = (
                          str(image.resolve())
                          .replace("'", "'\\''")
                      )

                      f.write(
                          f"file '{safe_path}'\n"
                      )

                      f.write(
                          f"duration "
                          f"{per_scene:.3f}\n"
                      )

                  safe_last = (
                      str(images[-1].resolve())
                      .replace("'", "'\\''")
                  )

                  f.write(
                      f"file '{safe_last}'\n"
                  )

              if vertical:

                  vf = (
                      "scale=1080:1920:"
                      "force_original_aspect_ratio="
                      "increase,"
                      "crop=1080:1920,"
                      "format=yuv420p"
                  )

              else:

                  vf = (
                      "scale=1280:720:"
                      "force_original_aspect_ratio="
                      "increase,"
                      "crop=1280:720,"
                      "format=yuv420p"
                  )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(slides),
                      "-i",
                      str(audio),
                      "-vf",
                      vf,
                      "-r",
                      "25",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "22",
                      "-c:a",
                      "aac",
                      "-b:a",
                      "160k",
                      "-shortest",
                      "-movflags",
                      "+faststart",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size < 10000
              ):
                  raise RuntimeError(
                      f"Video oluşmadı: {output}"
                  )


          # =========================================================
          # THUMBNAIL
          # =========================================================

          def prepare_thumbnail(
              source,
              output
          ):

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(source),
                      "-vf",
                      (
                          "scale=1280:720:"
                          "force_original_aspect_ratio="
                          "increase,"
                          "crop=1280:720"
                      ),
                      "-q:v",
                      "3",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size < 5000
              ):
                  raise RuntimeError(
                      "Thumbnail oluşturulamadı."
                  )


          # =========================================================
          # YOUTUBE
          # =========================================================

          def youtube():

              credentials = Credentials(
                  token=None,
                  refresh_token=os.environ[
                      "YOUTUBE_REFRESH_TOKEN"
                  ],
                  token_uri=(
                      "https://oauth2.googleapis.com/token"
                  ),
                  client_id=os.environ[
                      "GOOGLE_CLIENT_ID"
                  ],
                  client_secret=os.environ[
                      "GOOGLE_CLIENT_SECRET"
                  ],
                  scopes=[
                      "https://www.googleapis.com/"
                      "auth/youtube.upload"
                  ]
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=credentials,
                  cache_discovery=False
              )


          def upload_video(
              api,
              video_file,
              title,
              description,
              tags,
              thumbnail=None
          ):

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": description[:5000],
                      "tags": tags[:30],
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False,
                      "containsSyntheticMedia": True
                  }
              }

              media = MediaFileUpload(
                  str(video_file),
                  mimetype="video/mp4",
                  resumable=True,
                  chunksize=8 * 1024 * 1024
              )

              request = api.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = None
              retry = 0

              while response is None:

                  try:

                      status, response = (
                          request.next_chunk()
                      )

                      if status:
                          print(
                              "YouTube yükleme:",
                              int(
                                  status.progress()
                                  * 100
                              ),
                              "%"
                          )

                  except Exception as exc:

                      retry += 1

                      if retry > 5:
                          raise

                      wait = min(
                          2 ** retry,
                          30
                      )

                      print(
                          "YouTube bağlantı hatası:",
                          exc
                      )

                      print(
                          f"{wait} saniye bekleniyor..."
                      )

                      time.sleep(wait)

              video_id = response["id"]

              print(
                  "YouTube video ID:",
                  video_id
              )

              if (
                  thumbnail is not None
                  and thumbnail.exists()
              ):

                  thumb_media = MediaFileUpload(
                      str(thumbnail),
                      mimetype="image/jpeg"
                  )

                  api.thumbnails().set(
                      videoId=video_id,
                      media_body=thumb_media
                  ).execute()

                  print(
                      "Thumbnail yüklendi."
                  )

              return video_id


          # =========================================================
          # AÇIKLAMA
          # =========================================================

          def build_description(
              base_description,
              credits
          ):

              lines = [
                  str(base_description).strip(),
                  "",
                  "Bu video özgün senaryo, "
                  "yapay zekâ destekli seslendirme "
                  "ve Pexels görselleri kullanılarak "
                  "hazırlanmıştır.",
                  "",
                  "Pexels kaynakları:",
                  "Photos provided by Pexels"
              ]

              seen = set()

              for credit in credits:

                  photo_id = credit.get(
                      "id"
                  )

                  if photo_id in seen:
                      continue

                  seen.add(photo_id)

                  photographer = (
                      credit.get(
                          "photographer"
                      )
                      or "Pexels photographer"
                  )

                  url = credit.get(
                      "url",
                      ""
                  )

                  if url:

                      lines.append(
                          f"Photo by "
                          f"{photographer} "
                          f"on Pexels: {url}"
                      )

              lines.extend(
                  [
                      "",
                      "#KayıpHikâyeler",
                      "#Gizem",
                      "#Belgesel"
                  ]
              )

              return "\n".join(lines)[:5000]


