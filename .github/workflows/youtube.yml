name: YouTube AI Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install -U openai google-api-python-client google-auth requests piper-tts==1.4.2

      - name: Check secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY missing" && exit 1)
          test -n "$GOOGLE_CLIENT_ID" || (echo "GOOGLE_CLIENT_ID missing" && exit 1)
          test -n "$GOOGLE_CLIENT_SECRET" || (echo "GOOGLE_CLIENT_SECRET missing" && exit 1)
          test -n "$YOUTUBE_REFRESH_TOKEN" || (echo "YOUTUBE_REFRESH_TOKEN missing" && exit 1)
          test -n "$PEXELS_API_KEY" || (echo "PEXELS_API_KEY missing" && exit 1)
          echo "Secrets OK"

      - name: Run YouTube automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cat > automation.py <<'PY'
          import os
          import json
          import re
          import subprocess
          from pathlib import Path

          import requests
          from openai import OpenAI
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # =========================================================
          # AYARLAR
          # =========================================================

          OUT = Path("work")
          OUT.mkdir(exist_ok=True)

          client = OpenAI(
              api_key=os.environ["OPENAI_API_KEY"]
          )

          PEXELS_KEY = os.environ["PEXELS_API_KEY"]

          MIN_LONG_SECONDS = 480
          MAX_LONG_SECONDS = 780

          MIN_WORDS = 1100
          MAX_WORDS = 1350

          PIPER_DIR = OUT / "piper"
          PIPER_DIR.mkdir(exist_ok=True)

          PIPER_MODEL = (
              PIPER_DIR /
              "tr_TR-fahrettin-medium.onnx"
          )

          PIPER_CONFIG = (
              PIPER_DIR /
              "tr_TR-fahrettin-medium.onnx.json"
          )

          # Sabit commit:
          # CC0 lisanslı fahrettin Türkçe model.
          PIPER_BASE = (
              "https://huggingface.co/"
              "rhasspy/piper-voices/"
              "resolve/"
              "refs/pr/25/"
              "tr/tr_TR/fahrettin/medium/"
          )


          # =========================================================
          # GENEL YARDIMCI FONKSİYONLAR
          # =========================================================

          def run_command(command):
              print("CMD:", " ".join(map(str, command)))

              subprocess.run(
                  command,
                  check=True
              )


          def clean_json(text):
              text = text.strip()

              text = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              start = text.find("{")
              end = text.rfind("}")

              if start < 0 or end <= start:
                  raise ValueError(
                      "JSON bulunamadı."
                  )

              return json.loads(
                  text[start:end + 1]
              )


          def word_count(text):
              return len(
                  re.findall(
                      r"\b[\wÇĞİÖŞÜçğıöşü'-]+\b",
                      text
                  )
              )


          def get_duration(path):
              result = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(path)
                  ],
                  text=True
              )

              return float(
                  result.strip()
              )


          # =========================================================
          # PIPER TÜRKÇE MODELİ
          # =========================================================

          def install_piper_voice():

              if (
                  PIPER_MODEL.exists()
                  and PIPER_CONFIG.exists()
              ):
                  print("Piper modeli zaten mevcut.")
                  return

              print("Piper Türkçe modeli indiriliyor...")

              model_url = (
                  PIPER_BASE
                  + "tr_TR-fahrettin-medium.onnx"
              )

              config_url = (
                  PIPER_BASE
                  + "tr_TR-fahrettin-medium.onnx.json"
              )

              with requests.get(
                  model_url,
                  stream=True,
                  timeout=120
              ) as response:

                  response.raise_for_status()

                  with PIPER_MODEL.open("wb") as f:

                      for chunk in response.iter_content(
                          chunk_size=1024 * 1024
                      ):
                          if chunk:
                              f.write(chunk)

              with requests.get(
                  config_url,
                  timeout=60
              ) as response:

                  response.raise_for_status()

                  PIPER_CONFIG.write_bytes(
                      response.content
                  )

              if (
                  not PIPER_MODEL.exists()
                  or PIPER_MODEL.stat().st_size < 10_000_000
              ):
                  raise RuntimeError(
                      "Piper modeli düzgün indirilemedi."
                  )

              if (
                  not PIPER_CONFIG.exists()
                  or PIPER_CONFIG.stat().st_size < 500
              ):
                  raise RuntimeError(
                      "Piper config düzgün indirilemedi."
                  )

              print("Piper Türkçe modeli hazır.")


          # =========================================================
          # KONU + ARAŞTIRMA + SENARYO
          # =========================================================

          def ask_plan():

              prompt = r"""
          Türkçe YouTube belgesel kanalı "Kayıp Hikâyeler" için TEK bir bölüm hazırla.

          Konu gizem, bilim, tarih, arkeoloji, uzay, açıklanamayan olaylar
          veya şaşırtıcı ama doğrulanabilir gerçeklerden biri olsun.

          Evergreen konu seç.

          Siyasi propaganda, özel kişiler hakkında suçlama, tıbbi tavsiye
          ve uydurma paranormal iddialar kullanma.

          Web araması yap.

          Birincil kaynakları, üniversiteleri, müzeleri, devlet kurumlarını
          ve güvenilir bilim/haber kaynaklarını tercih et.

          Kaynaklarda olmayan tarih, sayı, alıntı veya olay uydurma.

          Tartışmalı bir iddia varsa tartışmalı olduğunu açıkça belirt.

          ANA VİDEO:
          - 8-12 dakika hedefle.
          - 1100-1350 Türkçe kelime yaz.
          - İlk 15 saniye çok güçlü merak kancası olsun.
          - Kanca.
          - Arka plan.
          - Olay ve kanıtların kronolojisi.
          - Alternatif açıklamalar.
          - En güçlü bulgular.
          - Şaşırtıcı ama dengeli sonuç.
          - Kısa kapanış.
          - Doğal konuşma dili.
          - Narration içinde başlık kullanma.
          - Kaynak listesini narration içine koyma.

          SHORT:
          - 40-60 saniye.
          - Bağımsız anlaşılmalı.
          - Güçlü kanca.
          - Kendi kapanışı.
          - Ana videodan basit kesit olmasın.

          GÖRSEL ARAMALARI:
          Ana video için 12 adet İngilizce Pexels arama sorgusu üret.
          Her sorgu 2-6 kelime olsun.
          Soyut ve aşırı sinematik ifadeler yerine Pexels'te bulunabilecek
          gerçek nesne, yer, kişi, olay veya ortamları tarif et.

          Short için 6 adet İngilizce Pexels arama sorgusu üret.

          Thumbnail için 1 adet İngilizce Pexels arama sorgusu üret.

          SADECE geçerli JSON döndür:

          {
            "title": "...",
            "description": "...",
            "tags": ["10-20 doğal Türkçe etiket"],
            "narration": "...",
            "short_title": "...",
            "short_narration": "...",
            "scene_queries": [
              "english search query 1",
              "english search query 2",
              "english search query 3",
              "english search query 4",
              "english search query 5",
              "english search query 6",
              "english search query 7",
              "english search query 8",
              "english search query 9",
              "english search query 10",
              "english search query 11",
              "english search query 12"
            ],
            "short_queries": [
              "english search query 1",
              "english search query 2",
              "english search query 3",
              "english search query 4",
              "english search query 5",
              "english search query 6"
            ],
            "thumbnail_query": "english thumbnail search query"
          }
          """

              response = client.responses.create(
                  model="gpt-5.4-mini",
                  tools=[
                      {
                          "type": "web_search"
                      }
                  ],
                  input=prompt,
                  reasoning={
                      "effort": "low"
                  },
                  max_output_tokens=10000
              )

              return clean_json(
                  response.output_text
              )


          def generate_plan():

              data = ask_plan()

              wc = word_count(
                  data.get(
                      "narration",
                      ""
                  )
              )

              short_wc = word_count(
                  data.get(
                      "short_narration",
                      ""
                  )
              )

              if not (
                  MIN_WORDS
                  <= wc
                  <= MAX_WORDS
              ):
                  raise RuntimeError(
                      f"Ana senaryo kelime sayısı "
                      f"hatalı: {wc}"
                  )

              if not (
                  100
                  <= short_wc
                  <= 220
              ):
                  raise RuntimeError(
                      f"Short senaryo kelime sayısı "
                      f"hatalı: {short_wc}"
                  )

              if len(
                  data.get(
                      "scene_queries",
                      []
                  )
              ) != 12:
                  raise RuntimeError(
                      "12 ana Pexels sorgusu oluşmadı."
                  )

              if len(
                  data.get(
                      "short_queries",
                      []
                  )
              ) != 6:
                  raise RuntimeError(
                      "6 Short Pexels sorgusu oluşmadı."
                  )

              if not data.get(
                  "thumbnail_query"
              ):
                  raise RuntimeError(
                      "Thumbnail sorgusu yok."
                  )

              print(
                  f"Plan OK: "
                  f"{wc} ana kelime / "
                  f"{short_wc} short kelime"
              )

              return data


          # =========================================================
          # PEXELS
          # =========================================================

          def pexels_search(
              query,
              orientation="landscape"
          ):

              query = re.sub(
                  r"[^A-Za-z0-9À-ÿ\s-]",
                  " ",
                  str(query)
              )

              query = re.sub(
                  r"\s+",
                  " ",
                  query
              ).strip()

              if not query:
                  query = "documentary"

              query = query[:100]

              response = requests.get(
                  "https://api.pexels.com/v1/search",
                  headers={
                      "Authorization": PEXELS_KEY
                  },
                  params={
                      "query": query,
                      "orientation": orientation,
                      "per_page": 15,
                      "page": 1
                  },
                  timeout=30
              )

              response.raise_for_status()

              photos = response.json().get(
                  "photos",
                  []
              )

              if not photos:
                  raise RuntimeError(
                      f"Pexels sonuç bulamadı: {query}"
                  )

              return photos


          def download_pexels_image(
              query,
              output,
              orientation,
              used_ids
          ):

              photos = pexels_search(
                  query,
                  orientation
              )

              selected = None

              for photo in photos:

                  if photo["id"] not in used_ids:
                      selected = photo
                      break

              if selected is None:
                  selected = photos[0]

              used_ids.add(
                  selected["id"]
              )

              src = selected["src"]

              if orientation == "portrait":
                  image_url = src.get(
                      "portrait"
                  ) or src.get(
                      "large2x"
                  )
              else:
                  image_url = src.get(
                      "landscape"
                  ) or src.get(
                      "large2x"
                  )

              if not image_url:
                  image_url = src["original"]

              image = requests.get(
                  image_url,
                  timeout=60
              )

              image.raise_for_status()

              output.write_bytes(
                  image.content
              )

              return {
                  "id": selected["id"],
                  "url": selected["url"],
                  "photographer": selected.get(
                      "photographer",
                      ""
                  ),
                  "photographer_url": selected.get(
                      "photographer_url",
                      ""
                  ),
                  "query": query
              }


          def generate_pexels_images(
              queries,
              prefix,
              orientation
          ):

              images = []
              credits = []
              used_ids = set()

              for index, query in enumerate(
                  queries
              ):

                  output = OUT / (
                      f"{prefix}_{index + 1:02d}.jpg"
                  )

                  credit = download_pexels_image(
                      query,
                      output,
                      orientation,
                      used_ids
                  )

                  images.append(output)
                  credits.append(credit)

                  print(
                      f"Pexels görsel hazır: "
                      f"{index + 1}/{len(queries)}"
                  )

              return images, credits


          # =========================================================
          # PIPER TTS
          # =========================================================

          def piper_tts(
              text,
              output
          ):

              chunks = []

              paragraphs = [
                  x.strip()
                  for x in re.split(
                      r"\n+",
                      text
                  )
                  if x.strip()
              ]

              current = ""

              for paragraph in paragraphs:

                  while len(paragraph) > 2500:

                      cut = paragraph.rfind(
                          " ",
                          0,
                          2500
                      )

                      if cut < 500:
                          cut = 2500

                      chunks.append(
                          paragraph[:cut].strip()
                      )

                      paragraph = paragraph[
                          cut:
                      ].strip()

                  if (
                      current
                      and len(current)
                      + len(paragraph)
                      + 1 > 2800
                  ):
                      chunks.append(current)
                      current = paragraph
                  else:
                      current += (
                          " "
                          if current
                          else ""
                      ) + paragraph

              if current:
                  chunks.append(current)

              if not chunks:
                  raise RuntimeError(
                      "TTS için metin yok."
                  )

              parts = []

              for index, chunk in enumerate(
                  chunks
              ):

                  part = OUT / (
                      f"piper_{output.stem}_"
                      f"{index:02d}.wav"
                  )

                  run_command(
                      [
                          "piper",
                          "--model",
                          str(PIPER_MODEL),
                          "--output_file",
                          str(part),
                          "--sentence_silence",
                          "0.18",
                          "--length_scale",
                          "1.0",
                          "--noise_scale",
                          "0.667",
                          "--noise_w",
                          "0.8",
                          "--",
                          chunk
                      ]
                  )

                  if (
                      not part.exists()
                      or part.stat().st_size < 1000
                  ):
                      raise RuntimeError(
                          f"Piper ses oluşturamadı: "
                          f"{part}"
                      )

                  parts.append(part)

              concat = OUT / (
                  f"{output.stem}_concat.txt"
              )

              with concat.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for part in parts:
                      f.write(
                          "file '"
                          + str(
                              part.resolve()
                          ).replace(
                              "'",
                              "'\\''"
                          )
                          + "'\n"
                      )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(concat),
                      "-vn",
                      "-c:a",
                      "libmp3lame",
                      "-b:a",
                      "160k",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size < 1000
              ):
                  raise RuntimeError(
                      "Piper ses dosyası oluşmadı."
                  )


          # =========================================================
          # VİDEO
          # =========================================================

          def make_video(
              audio,
              images,
              output,
              vertical=False
          ):

              if not images:
                  raise RuntimeError(
                      "Video için görsel yok."
                  )

              total = get_duration(
                  audio
              )

              per_scene = (
                  total / len(images)
              )

              if per_scene < 2:
                  raise RuntimeError(
                      "Görsel başına süre çok kısa."
                  )

              slides = OUT / (
                  f"{output.stem}_slides.txt"
              )

              with slides.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for image in images:

                      f.write(
                          "file '"
                          + str(
                              image.resolve()
                          ).replace(
                              "'",
                              "'\\''"
                          )
                          + "'\n"
                      )

                      f.write(
                          f"duration "
                          f"{per_scene:.3f}\n"
                      )

                  f.write(
                      "file '"
                      + str(
                          images[-1].resolve()
                      ).replace(
                          "'",
                          "'\\''"
                      )
                      + "'\n"
                  )

              if vertical:

                  vf = (
                      "scale=1080:1920:"
                      "force_original_aspect_ratio="
                      "increase,"
                      "crop=1080:1920,"
                      "format=yuv420p"
                  )

              else:

                  vf = (
                      "scale=1280:720:"
                      "force_original_aspect_ratio="
                      "increase,"
                      "crop=1280:720,"
                      "format=yuv420p"
                  )

              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "concat",
                      "-safe",
                      "0",
                      "-i",
                      str(slides),
                      "-i",
                      str(audio),
                      "-vf",
                      vf,
                      "-r",
                      "25",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "medium",
                      "-crf",
                      "21",
                      "-c:a",
                      "aac",
                      "-b:a",
                      "160k",
                      "-shortest",
                      "-movflags",
                      "+faststart",
                      str(output)
                  ]
              )

              if (
                  not output.exists()
                  or output.stat().st_size < 10000
              ):
                  raise RuntimeError(
                      f"Video oluşturulamadı: {output}"
                  )


          # =========================================================
          # YOUTUBE
          # =========================================================

          def youtube():

              credentials = Credentials(
                  token=None,
                  refresh_token=os.environ[
                      "YOUTUBE_REFRESH_TOKEN"
                  ],
                  token_uri=(
                      "https://oauth2.googleapis.com/token"
                  ),
                  client_id=os.environ[
                      "GOOGLE_CLIENT_ID"
                  ],
                  client_secret=os.environ[
                      "GOOGLE_CLIENT_SECRET"
                  ],
                  scopes=[
                      "https://www.googleapis.com/"
                      "auth/youtube.upload"
                  ]
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=credentials
              )


          def upload(
              api,
              video_file,
              title,
              description,
              tags,
              thumbnail=None
          ):

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": description[:5000],
                      "tags": tags[:30],
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False,
                      "containsSyntheticMedia": True
                  }
              }

              media = MediaFileUpload(
                  str(video_file),
                  mimetype="video/mp4",
                  resumable=True,
                  chunksize=8 * 1024 * 1024
              )

              response = api.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              ).execute()

              video_id = response["id"]

              print(
                  "VIDEO BAŞARIYLA YÜKLENDİ:",
                  video_id
              )

              if (
                  thumbnail
                  and thumbnail.exists()
              ):

                  thumb_media = MediaFileUpload(
                      str(thumbnail),
                      mimetype="image/jpeg"
                  )

                  api.thumbnails().set(
                      videoId=video_id,
                      media_body=thumb_media
                  ).execute()

                  print(
                      "THUMBNAIL BAŞARIYLA YÜKLENDİ:",
                      video_id
                  )

              return video_id


          # =========================================================
          # ANA İŞLEM
          # =========================================================

          print("=" * 60)
          print("MALİYET ODAKLI YOUTUBE OTOMASYONU BAŞLIYOR")
          print("=" * 60)

          install_piper_voice()

          # ---------------------------------------------------------
          # 1. PLAN / ARAŞTIRMA / SENARYO
          # ---------------------------------------------------------

          data = generate_plan()

          # ---------------------------------------------------------
          # 2. ANA SES - ÜCRETSİZ PIPER
          # ---------------------------------------------------------

          long_audio = OUT / "long_audio.mp3"

          piper_tts(
              data["narration"],
              long_audio
          )

          long_seconds = get_duration(
              long_audio
          )

          print(
              f"Ana ses süresi: "
              f"{long_seconds:.1f} saniye"
          )

          if not (
              MIN_LONG_SECONDS
              <= long_seconds
              <= MAX_LONG_SECONDS
          ):

              raise RuntimeError(
                  "Ana video ses süresi hatalı: "
                  f"{long_seconds:.1f} saniye"
              )

          # ---------------------------------------------------------
          # 3. ANA GÖRSELLER - PEXELS
          # ---------------------------------------------------------

          long_images, long_credits = (
              generate_pexels_images(
                  data["scene_queries"],
                  "long_scene",
                  "landscape"
              )
          )

          long_video = OUT / "long_video.mp4"

          make_video(
              long_audio,
              long_images,
              long_video,
              vertical=False
          )

          # ---------------------------------------------------------
          # 4. SHORT SES - ÜCRETSİZ PIPER
          # ---------------------------------------------------------

          short_audio = OUT / "short_audio.mp3"

          piper_tts(
              data["short_narration"],
              short_audio
          )

          short_seconds = get_duration(
              short_audio
          )

          print(
              f"Short süresi: "
              f"{short_seconds:.1f} saniye"
          )

          if not (
              35
              <= short_seconds
              <= 75
          ):

              raise RuntimeError(
                  "Short ses süresi hatalı: "
                  f"{short_seconds:.1f} saniye"
              )

          # ---------------------------------------------------------
          # 5. SHORT GÖRSELLER - PEXELS
          # ---------------------------------------------------------

          short_images, short_credits = (
              generate_pexels_images(
                  data["short_queries"],
                  "short_scene",
                  "portrait"
              )
          )

          short_video = OUT / "short_video.mp4"

          make_video(
              short_audio,
              short_images,
              short_video,
              vertical=True
          )

          # ---------------------------------------------------------
          # 6. THUMBNAIL - PEXELS
          # ---------------------------------------------------------

          thumbnail = OUT / "thumbnail.jpg"

          thumb_credit = (
              download_pexels_image(
                  data["thumbnail_query"],
                  thumbnail,
                  "landscape",
                  set()
              )
          )

          # ---------------------------------------------------------
          # 7. PEXELS KREDİLERİ
          # ---------------------------------------------------------

          all_credits = (
              long_credits
              + short_credits
              + [thumb_credit]
          )

          credit_lines = [
              "\nPexels kaynakları:"
          ]

          credit_lines.append(
              "Photos provided by Pexels"
          )

          seen = set()

          for credit in all_credits:

              key = credit["id"]

              if key in seen:
                  continue

              seen.add(key)

              photographer = (
                  credit["photographer"]
                  or "Pexels photographer"
              )

              url = credit["url"]

              credit_lines.append(
                  f"Photo by {photographer} "
                  f"on Pexels: {url}"
              )

          pexels_credits = "\n".join(
              credit_lines
          )

          description = (
              data["description"].strip()
              + "\n\n"
              "Bu video özgün senaryo, "
              "yerel yapay zekâ destekli "
              "seslendirme ve Pexels görselleri "
              "kullanılarak hazırlanmıştır."
              "\n"
              + pexels_credits
              + "\n\n"
              "#KayıpHikâyeler #Gizem #Belgesel"
          )

          # ---------------------------------------------------------
          # 8. METADATA
          # ---------------------------------------------------------

          metadata = {
              "title": data["title"],
              "short_title": data["short_title"],
              "scene_queries": data["scene_queries"],
              "short_queries": data["short_queries"],
              "thumbnail_query": data["thumbnail_query"],
              "pexels_credits": all_credits,
              "long_seconds": long_seconds,
              "short_seconds": short_seconds
          }

          (OUT / "metadata.json").write_text(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 9. YOUTUBE
          # ---------------------------------------------------------

          api = youtube()

          upload(
              api,
              long_video,
              data["title"],
              description,
              data["tags"],
              thumbnail
          )

          upload(
              api,
              short_video,
              data["short_title"],
              description,
              data["tags"][:15],
              None
          )

          print("=" * 60)
          print("AUTOMATION COMPLETED")
          print("=" * 60)
          PY

          python -m py_compile automation.py
          python automation.py
