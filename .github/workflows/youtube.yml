          # =========================================================
          # YOUTUBE UPLOAD
          # =========================================================

          def upload_video(
              api,
              video_file,
              title,
              description,
              tags,
              thumbnail=None
          ):

              safe_tags = [
                  str(tag).strip()
                  for tag in tags
                  if str(tag).strip()
              ][:30]

              body = {
                  "snippet": {
                      "title":
                          str(title)[:100],
                      "description":
                          str(description)[:5000],
                      "tags":
                          safe_tags,
                      "categoryId":
                          "27"
                  },
                  "status": {
                      "privacyStatus":
                          "public",
                      "selfDeclaredMadeForKids":
                          False,
                      "containsSyntheticMedia":
                          True
                  }
              }

              media = MediaFileUpload(
                  str(video_file),
                  mimetype="video/mp4",
                  resumable=True,
                  chunksize=8 * 1024 * 1024
              )

              request = (
                  api
                  .videos()
                  .insert(
                      part="snippet,status",
                      body=body,
                      media_body=media
                  )
              )

              response = None
              retry = 0

              while response is None:

                  try:

                      status, response = (
                          request.next_chunk()
                      )

                      if status:

                          print(
                              "YouTube:",
                              int(
                                  status.progress()
                                  * 100
                              ),
                              "%"
                          )

                  except HttpError as exc:

                      code = getattr(
                          exc.resp,
                          "status",
                          0
                      )

                      if code not in {
                          429,
                          500,
                          502,
                          503,
                          504
                      }:
                          raise

                      retry += 1

                      if retry > 6:
                          raise

                      wait = min(
                          2 ** retry,
                          60
                      )

                      print(
                          f"YouTube geçici hata "
                          f"{code}; {wait}s"
                      )

                      time.sleep(wait)

                  except Exception as exc:

                      retry += 1

                      if retry > 6:
                          raise

                      wait = min(
                          2 ** retry,
                          60
                      )

                      print(
                          "YouTube bağlantı hatası:",
                          exc
                      )

                      time.sleep(wait)

              video_id = response["id"]

              print(
                  "YouTube video ID:",
                  video_id
              )

              if (
                  thumbnail
                  and thumbnail.exists()
              ):

                  thumb_media = (
                      MediaFileUpload(
                          str(thumbnail),
                          mimetype="image/jpeg"
                      )
                  )

                  (
                      api
                      .thumbnails()
                      .set(
                          videoId=video_id,
                          media_body=thumb_media
                      )
                      .execute()
                  )

                  print(
                      "Thumbnail yüklendi."
                  )

              return video_id


          # =========================================================
          # AÇIKLAMA
          # =========================================================

          def build_description(
              base_description,
              credits
          ):

              lines = [
                  str(
                      base_description
                  ).strip(),
                  "",
                  "Bu video özgün senaryo, "
                  "yapay zekâ destekli seslendirme "
                  "ve Pexels görselleri kullanılarak "
                  "hazırlanmıştır.",
                  "",
                  "Pexels kaynakları:",
                  "Photos provided by Pexels"
              ]

              seen = set()

              for credit in credits:

                  if not credit:
                      continue

                  photo_id = credit.get("id")

                  if photo_id in seen:
                      continue

                  seen.add(photo_id)

                  photographer = (
                      credit.get(
                          "photographer"
                      )
                      or
                      "Pexels photographer"
                  )

                  url = credit.get(
                      "url",
                      ""
                  )

                  if url:

                      lines.append(
                          f"Photo by "
                          f"{photographer} "
                          f"on Pexels: "
                          f"{url}"
                      )

              lines.extend(
                  [
                      "",
                      "#KayıpHikâyeler",
                      "#Gizem",
                      "#Belgesel"
                  ]
              )

              return "\n".join(lines)[:5000]


